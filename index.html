/* ══════════ 情境選擇 ══════════ */
var pickSel = {};
/* 哪一區是展開的。兩區都預設收起來：27 個分類攤開要滑很久，
   而且第一眼就要讓人看到「生活單字」這一區的存在。*/
var openGrp = { talk:false, word:false };
function scenePickScreen(mode){
  if(!Object.keys(pickSel).length) SCENES.forEach(function(s){ pickSel[s.id]=true; });
  /* 27 個分類排成一排太長，分成「會話句型」和「生活單字」兩區，各自可收合 */
  var h = '<div class="eyebrow">選要練的情境</div>';
  GROUPS.forEach(function(g){
    var list = SCENES.filter(function(s){ return g.ids[s.id]; });
    if(!list.length) return;
    var gt = tally(function(x){ return g.ids[x.s]; });
    h += '<div class="grp" data-g="'+g.id+'"'+(openGrp[g.id]?'':' data-shut="1"')+'>'+
      '<button class="grph" data-gt="'+g.id+'"><span class="gchev"></span>'+
        '<span class="gtx"><strong>'+esc(g.t)+'</strong><em>'+esc(g.d)+'</em>'+
        miniBar(gt,'gbar')+
        '<em class="gnum">'+gt.known+' / '+gt.total+' 已學會</em></span>'+
        '<span class="gcnt" data-gc="'+g.id+'"></span></button>'+
      '<div class="gbody"><div class="row tight">'+
        '<button class="btn ghost sm" data-ga="'+g.id+'">這區全選</button>'+
        '<button class="btn ghost sm" data-gn="'+g.id+'">這區全不選</button></div>'+
      '<div class="scenes">';
    list.forEach(function(s){
      var t = tally(function(x){ return x.s===s.id; });
      h += '<button class="scene" data-s="'+s.id+'" aria-pressed="'+(pickSel[s.id]?'true':'false')+
        '" style="--sc:'+s.color+'"><span class="bar2"></span>'+
        '<span class="b"><strong>'+esc(s.label)+'</strong>'+
          miniBar(t,'smini')+
          '<em>'+t.known+' / '+t.total+' 已學會</em></span>'+
        '<span class="tick"></span></button>';
    });
    h += '</div></div></div>';
  });
  h += '<div class="row"><button class="btn ghost" id="all">全選</button>'+
       '<button class="btn ghost" id="none">全不選</button></div>'+
       '<div class="note zh" id="left"></div>'+
       '<div class="spacer"></div>'+
       '<button class="btn primary" id="start">開始練習</button>';
  var d = screen(h);
  function sync(){
    d.querySelectorAll('.scene').forEach(function(b){
      b.setAttribute('aria-pressed', pickSel[b.dataset.s]?'true':'false'); });
    GROUPS.forEach(function(g){
      var list = SCENES.filter(function(s){ return g.ids[s.id]; });
      var on = list.filter(function(s){ return pickSel[s.id]; }).length;
      var el = d.querySelector('[data-gc="'+g.id+'"]');
      if(el) el.textContent = on ? on+' / '+list.length : '未選';
      if(el) el.className = 'gcnt'+(on?' on':'');
    });
    var any = SCENES.some(function(s){ return pickSel[s.id]; });
    d.querySelector('#start').disabled = !any;
    var note = d.querySelector('#left');
    if(!any){ note.textContent='至少選一個情境。'; return; }
    var left = freshLeft(pickSel, mode), tot = poolOf(pickSel, mode).length;
    note.innerHTML = left
      ? '選到的情境共 <b>'+tot+'</b> 句，其中 <b>'+left+' 句你還沒練過</b>。每一輪會優先出沒練過的，練完可以直接接下一輪。'
      : '這些情境的 <b>'+tot+'</b> 句你都練過了，接下來會以複習為主。';
  }
  d.querySelectorAll('.scene').forEach(function(b){
    b.onclick=function(){ pickSel[b.dataset.s]=!pickSel[b.dataset.s]; sync(); }; });
  d.querySelectorAll('[data-gt]').forEach(function(b){
    b.onclick=function(){
      var g=b.dataset.gt; openGrp[g]=!openGrp[g];
      var box=d.querySelector('.grp[data-g="'+g+'"]');
      if(openGrp[g]) box.removeAttribute('data-shut'); else box.setAttribute('data-shut','1');
    };
  });
  d.querySelectorAll('[data-ga]').forEach(function(b){ b.onclick=function(){
    SCENES.forEach(function(s){ if(GROUPS.filter(function(g){return g.id===b.dataset.ga;})[0].ids[s.id]) pickSel[s.id]=true; });
    sync(); }; });
  d.querySelectorAll('[data-gn]').forEach(function(b){ b.onclick=function(){
    SCENES.forEach(function(s){ if(GROUPS.filter(function(g){return g.id===b.dataset.gn;})[0].ids[s.id]) pickSel[s.id]=false; });
    sync(); }; });
  d.querySelector('#all').onclick=function(){ SCENES.forEach(function(s){pickSel[s.id]=true;}); sync(); };
  d.querySelector('#none').onclick=function(){ SCENES.forEach(function(s){pickSel[s.id]=false;}); sync(); };
  d.querySelector('#start').onclick=function(){
    prime();
    var sel={}; SCENES.forEach(function(s){ if(pickSel[s.id]) sel[s.id]=true; });
    startRound(sel, mode, 1);
  };
  sync();
  return d;
}
/* 一輪結束可以直接開下一輪，每輪都會先給沒練過的句子 */
function startRound(sel, mode, round){
  var pool = buildBatch(sel, mode, S.count);
  if(!pool.length) return;
  var only = SCENES.filter(function(s){ return sel[s.id]; });
  var col = only.length===1 ? only[0].color : '';
  var name = MODES.filter(function(x){ return x.id===mode; })[0].t;
  var ctx = { sel:sel, mode:mode, round:round||1, kind:'round' };
  if(mode==='speak') startSpeak(pool, col, ctx);
  else if(mode==='shadow') startShadow(pool, col, ctx);
  else startQuiz(pool, mode, name, col, ctx);
}

/* ══════════ 選擇題 ══════════ */
/* 干擾選項不能和正解「撞車」。要同時檢查三件事：
   1) 中文一樣 → 中翻日題會出現兩個正確答案
   2) 朗讀一樣 → 聽力題兩個選項唸起來一模一樣，怎麼選都是賭
      （日文同音詞很多：あめ 雨/飴、はな 鼻/花、した 舌/下…）
   3) 顯示的日文一樣 → 畫面上出現兩顆一樣的按鈕
   所以用這三者組出一把指紋，撞到就跳過。*/
function optKey(o){ return toKanji(o.j)+'\u0001'+sayOf(o)+'\u0001'+o.z; }
function makeOptions(item, pool, kind){
  var same = pool.filter(function(x){ return x.s===item.s && x.i!==item.i; });
  var other= ITEMS.filter(function(x){ return x.s!==item.s && x.i!==item.i; });
  var cand = shuffle(same).concat(shuffle(other));
  var out=[item], used={};
  function take(o){
    var p = optKey(o).split('\u0001');
    if(used['k'+p[0]] || used['s'+p[1]] || used['z'+p[2]]) return false;
    used['k'+p[0]]=used['s'+p[1]]=used['z'+p[2]]=1;
    return true;
  }
  take(item);
  for(var i=0;i<cand.length && out.length<4;i++) if(take(cand[i])) out.push(cand[i]);
  return shuffle(out);
}
function startQuiz(pool, mode, title, color, ctx){
  var ix=0, right=0, wrong=[], gained=0, run=0;   /* run = 目前連續答對幾題 */
  ctx = ctx || {};
  function render(){
    var item = pool[ix];
    var kind = mode==='mix' ? (ix%2 ? 'produce':'listen') : mode;
    var opts = makeOptions(item, pool, kind);
    var answered=false, box=boxOf(item.i);
    var h = '<div class="prog"><span>'+(ix+1)+' / '+pool.length+
      (ctx.round>1?'　<b>第 '+ctx.round+' 輪</b>':'')+'</span>'+
      '<span class="track"><i class="fill" style="width:'+(ix/pool.length*100)+'%"></i></span>'+
      '<span class="lvl" style="color:'+LVLC[box]+'">'+LVL[box]+'</span></div>';
    if(kind==='listen'){
      h += '<div class="stage"><div class="ask">聽聽看這句是什麼意思</div>'+
        '<button class="speaker" id="spk" aria-label="播放">'+SVG.speaker+'</button>'+
        '<div class="row2"><button class="replay" id="slow">'+SVG.replay+' 放慢・分段再聽一次</button></div>'+
        '<div id="reveal" hidden></div></div>';
    } else {
      h += '<div class="stage"><div class="ask">這句日文怎麼說？</div>'+
        '<div class="big-zh zh">'+esc(item.z)+'</div>'+
        '<div id="reveal" hidden></div></div>';
    }
    h += '<div class="opts" id="opts">';
    opts.forEach(function(o,n){
      var txt = kind==='listen' ? '<span class="zh">'+esc(o.z)+'</span>' : '<span class="jp" lang="ja">'+jpHTML(o.j)+'</span>';
      h += '<button class="opt" data-i="'+o.i+'"><span class="k">'+(n+1)+'</span><span class="txt">'+txt+'</span></button>';
    });
    h += '</div><div id="after"></div><div class="spacer"></div>';
    var d = screen(h);
    var spk = d.querySelector('#spk');
    function play(rate){ if(spk) spk.classList.add('playing');
      return speak(sayOf(item), rate).then(function(){ if(spk) spk.classList.remove('playing'); }); }
    if(kind==='listen'){
      spk.onclick=function(){ play(); };
      d.querySelector('#slow').onclick=function(){
        if(spk) spk.classList.add('playing');
        speakSlow(sayOf(item)).then(function(){ if(spk) spk.classList.remove('playing'); });
      };
      setTimeout(function(){ play(); }, 260);
    }
    d.querySelectorAll('.opt').forEach(function(b){
      b.onclick=function(){
        if(answered) return; answered=true;
        var good = b.dataset.i===item.i;
        var mv = mark(item.i, good);
        if(mv.levelUp) gained++;
        if(good){ right++; run++; } else { wrong.push(item); run=0; }
        var mood = good ? (run>=3 ? 'streak' : 'good') : 'bad';
        sfxFor(mood);
        d.querySelectorAll('.opt').forEach(function(o){
          if(o.dataset.i===item.i) o.classList.add('good');
          else if(o===b) o.classList.add('bad');
          else o.classList.add('dim');
        });
        var rv = d.querySelector('#reveal');
        rv.hidden=false;
        rv.innerHTML = (kind==='listen'
            ? '<div class="big-jp jp">'+jpHTML(item.j)+'</div><div class="sub-zh zh">'+esc(item.z)+'</div>'
            : '<div class="sub-jp jp">'+jpHTML(item.j)+'</div>');
        var af = d.querySelector('#after'), ah='';
        ah += '<div class="grow">'+guide(mood,'sm')+'<div class="gtext">'+
              '<div class="verdict '+(good?'ok':'no')+'"><span class="mk">'+(good?'✓':'✕')+'</span>'+
              (good ? (run>=3 ? '連續答對 '+run+' 題' : '答對了') : '正確答案是上面綠色那個')+'</div></div></div>';
        /* 讓每一次作答都看得到熟練度的變化 */
        ah += '<div class="lvlup"><span class="muted">熟練度</span>'+
              '<span class="pips">'+pips(mv.before)+'</span><span class="arrow">→</span>'+
              '<span class="pips">'+pips(mv.after)+'</span>'+
              '<b style="color:'+LVLC[mv.after]+'">'+LVL[mv.after]+'</b></div>';
        if(mv.levelUp) ah += '<div class="banner good" style="margin-top:9px"><span class="ic">✓</span>'+
              '<div>這句算你<b>學會了</b>。再答對兩次就會變成「已精通」。</div></div>';
        if(item.n) ah += '<div class="note zh"><b>用法：</b>'+esc(item.n)+'</div>';
        ah += '<button class="btn primary" id="next" style="margin-top:12px">'+
              (ix+1>=pool.length?'看結果':'下一題')+'</button>';
        af.innerHTML = ah;
        af.querySelector('#next').onclick=function(){
          ix++; if(ix>=pool.length) showResult(right,pool.length,wrong,title,color,gained,ctx);
          else replace(render,title,color);
        };
        if(kind!=='listen') setTimeout(play, 420);
        setTimeout(function(){ af.scrollIntoView({block:'nearest',behavior:'smooth'}); },60);
      };
    });
    return d;
  }
  go(render, title, color);
}

/* ══════════ 口說練習 ══════════ */
function startSpeak(pool, color, ctx){
  ctx = ctx || {};
  var ix=0, great=0, results=[], gained=0, stopped=false;
  function render(){
    stopped = false;                 /* 每題重置，replace() 先呼叫過 autoStop() */
    var item = pool[ix];
    var h = '<div class="prog"><span>'+(ix+1)+' / '+pool.length+'</span>'+
      '<span class="track"><i class="fill" style="width:'+(ix/pool.length*100)+'%"></i></span>'+
      '<span id="hf">'+(S.hands?'免持中':'')+'</span></div>'+
      '<div class="stage"><div class="ask" id="ask">看著中文，用日文念出來</div>'+
      '<div class="big-zh zh">'+esc(item.z)+'</div>'+
      '<div id="jp" '+(S.model?'':'hidden')+'><div class="sub-jp jp">'+jpHTML(item.j)+'</div></div>'+
      '<button class="mic" id="mic" aria-label="開始錄音">'+SVG.mic+'</button>'+
      '<div class="heard" id="heard"></div>'+
      '<div class="meter"><i id="meter" style="width:0"></i></div>'+
      '<button class="replay" id="model">'+SVG.small+' 聽範讀</button></div>'+
      '<div id="after"></div><div class="spacer"></div>'+
      '<div class="row"><button class="btn ghost" id="skip">跳過</button>'+
      '<button class="btn ghost" id="toggleJp">'+(S.model?'蓋住日文':'顯示日文')+'</button></div>';
    var d = screen(h);
    var mic=d.querySelector('#mic'), heard=d.querySelector('#heard'),
        meter=d.querySelector('#meter'), after=d.querySelector('#after'), ask=d.querySelector('#ask');

    function nextQ(){
      ix++;
      if(ix>=pool.length){ wake(false); showSpeakResult(great,pool.length,results,color,gained,ctx); }
      else replace(render,'口說練習',color);
    }
    function finish(res){
      var g = res.list ? grade(res.list, item) : null;
      mic.classList.remove('live');
      if(!g){
        var msg = ASR_ERR[res.err] || '沒有辨識到內容，再試一次。';
        heard.innerHTML = '';
        after.innerHTML = '<div class="banner"><span class="ic">！</span><div>'+esc(msg)+'</div></div>'+
          '<div class="row" style="margin-top:12px">'+
          '<button class="btn ghost" id="retry">再念一次</button>'+
          '<button class="btn primary" id="self">我念對了</button></div>';
        after.querySelector('#retry').onclick=function(){ after.innerHTML=''; run(); };
        after.querySelector('#self').onclick=function(){ if(mark(item.i,true).levelUp) gained++; great++;
          results.push({item:item,score:1,self:true}); nextQ(); };
        return;
      }
      var lvl=g.level, pct=Math.round(g.score*100);
      heard.innerHTML = lcsMark(g.cmp[0], g.cmp[1]);
      meter.style.width = pct+'%';
      meter.style.background = lvl==='great'?'var(--ok)':(lvl==='close'?'var(--warn)':'var(--bad)');
      var okNow = lvl==='great';
      if(mark(item.i, okNow).levelUp) gained++;
      if(okNow) great++;
      results.push({item:item,score:g.score,heard:g.heard});
      var vt = lvl==='great' ? ['ok','✓','完全正確']
             : lvl==='close' ? ['mid','～','快到了，有幾個字不一樣']
             : ['no','✕','差比較多，再念一次試試'];
      var ah = '<div class="verdict '+vt[0]+'"><span class="mk">'+vt[1]+'</span>'+vt[2]+
               ' <span class="muted" style="font-weight:400;font-size:13px">'+pct+'%</span></div>'+
               '<div class="note zh">辨識到：<b class="jp" lang="ja">'+esc(g.heard)+'</b><br>正確說法：<b class="jp" lang="ja">'+esc(toKanji(item.j))+'</b></div>';
      if(item.n) ah += '<div class="note zh" style="margin-top:8px"><b>用法：</b>'+esc(item.n)+'</div>';
      ah += '<div class="row" style="margin-top:12px">'+
            '<button class="btn ghost" id="again">再念一次</button>'+
            '<button class="btn primary" id="next">'+(ix+1>=pool.length?'看結果':'下一句')+'</button></div>';
      after.innerHTML = ah;
      after.querySelector('#again').onclick=function(){ after.innerHTML=''; heard.innerHTML='';
        meter.style.width='0'; run(); };
      after.querySelector('#next').onclick=nextQ;
      setTimeout(function(){ after.scrollIntoView({block:'nearest',behavior:'smooth'}); },60);
      if(S.hands && !stopped){ setTimeout(function(){ if(!stopped) nextQ(); }, lvl==='great'?1600:2800); }
    }
    async function run(){
      if(stopped) return;
      after.innerHTML=''; heard.innerHTML=''; meter.style.width='0';
      if(S.model){ ask.textContent='先聽一次範讀'; await speak(sayOf(item)); }
      if(stopped) return;
      ask.textContent='嗶一聲之後請念出來';
      beep(880,150); await sleep(330);
      if(stopped) return;
      mic.classList.add('live'); ask.textContent='請念⋯⋯';
      var res = await listen(function(t){ heard.textContent = t; });
      ask.textContent='看著中文，用日文念出來';
      finish(res);
    }
    mic.onclick=function(){ prime(); if(recLive){ stopRec(); } else { run(); } };
    d.querySelector('#model').onclick=function(){ prime(); speak(sayOf(item)); };
    d.querySelector('#skip').onclick=nextQ;
    d.querySelector('#toggleJp').onclick=function(){
      S.model=!S.model; saveSet(); replace(render,'口說練習',color); };
    if(S.hands){ wake(true); setTimeout(function(){ prime(); run(); }, 420); }
    autoStop = function(){ stopped=true; stopRec(); };
    return d;
  }
  if(!ASR_PRESENT){
    go(function(){
      var d = screen('<div class="banner"><span class="ic">！</span><div>'+
        '這個瀏覽器／環境沒有語音辨識。你還是可以用「自評」的方式練：聽範讀 → 自己念 → 自己判斷。'+
        '<br><br>想用自動辨識的話，請在 <b>Android Chrome</b> 或 <b>iPhone Safari</b> 開啟，'+
        '而且網址必須是 <b>https</b> 或 <b>localhost</b>。</div></div>'+
        '<button class="btn primary" id="go">用自評模式開始</button>');
      d.querySelector('#go').onclick=function(){ prime(); replace(function(){
        return startSpeakSelf(pool,color,ctx); },'口說練習（自評）',color); };
      return d;
    }, '口說練習', color);
    return;
  }
  go(render, '口說練習', color);
}
function startSpeakSelf(pool,color,ctx){
  ctx = ctx || {};
  var ix=0, ok=0, results=[], gained=0;
  function render(){
    var item=pool[ix];
    var h='<div class="prog"><span>'+(ix+1)+' / '+pool.length+'</span>'+
      '<span class="track"><i class="fill" style="width:'+(ix/pool.length*100)+'%"></i></span><span></span></div>'+
      '<div class="stage"><div class="ask">用日文念出來，再對答案</div>'+
      '<div class="big-zh zh">'+esc(item.z)+'</div>'+
      '<button class="speaker" id="spk">'+SVG.speaker+'</button>'+
      '<div id="rv" hidden></div></div><div id="after"></div><div class="spacer"></div>'+
      '<button class="btn primary" id="show">對答案</button>';
    var d=screen(h);
    d.querySelector('#spk').onclick=function(){ speak(sayOf(item)); };
    d.querySelector('#show').onclick=function(){
      var rv=d.querySelector('#rv'); rv.hidden=false;
      rv.innerHTML='<div class="big-jp jp">'+jpHTML(item.j)+'</div>';
      speak(sayOf(item));
      var ah = (item.n?'<div class="note zh"><b>用法：</b>'+esc(item.n)+'</div>':'')+
        '<div class="row" style="margin-top:12px">'+
        '<button class="btn ghost" id="no">再練一次</button>'+
        '<button class="btn primary" id="yes">我念對了</button></div>';
      d.querySelector('#after').innerHTML=ah;
      d.querySelector('#show').hidden=true;
      d.querySelector('#no').onclick=function(){ mark(item.i,false); results.push({item:item,score:0}); step(); };
      d.querySelector('#yes').onclick=function(){ if(mark(item.i,true).levelUp) gained++;
        ok++; results.push({item:item,score:1}); step(); };
    };
    function step(){ ix++; if(ix>=pool.length) showSpeakResult(ok,pool.length,results,color,gained,ctx);
      else replace(render,'口說練習（自評）',color); }
    return d;
  }
  return render();
}

/* ══════════ 聽讀跟讀（免持） ══════════ */
function startShadow(pool, color, ctx){
  ctx = ctx || {};
  var ix=0, playing=true, stopped=false, gained=0;
  function render(){
    stopped = false;                 /* 每句重置 */
    var item=pool[ix];
    var h='<div class="prog"><span>'+(ix+1)+' / '+pool.length+'</span>'+
      '<span class="track"><i class="fill" style="width:'+(ix/pool.length*100)+'%"></i></span>'+
      '<span id="st">播放中</span></div>'+
      '<div class="stage"><div class="ask">'+esc(SC[item.s]?SC[item.s].label:'')+'</div>'+
      '<div class="big-jp jp">'+jpHTML(item.j)+'</div>'+
      '<div class="sub-zh zh">'+esc(item.z)+'</div>'+
      (item.n?'<div class="note zh" style="text-align:left;align-self:stretch">'+esc(item.n)+'</div>':'')+
      '</div><div class="spacer"></div>'+
      '<div class="row"><button class="btn ghost" id="prev">上一句</button>'+
      '<button class="btn ghost" id="nx">下一句</button></div>'+
      '<button class="btn primary" id="pp">暫停</button>';
    var d=screen(h);
    var st=d.querySelector('#st'), pp=d.querySelector('#pp');
    function sync(){ st.textContent = playing?'播放中':'已暫停'; pp.textContent = playing?'暫停':'繼續'; }
    pp.onclick=function(){ playing=!playing; sync();
      if(playing){ prime(); loop(); } else { stopSpeak(); } };
    d.querySelector('#prev').onclick=function(){ stopSpeak(); ix=(ix-1+pool.length)%pool.length;
      replace(render,'聽讀跟讀',color); };
    d.querySelector('#nx').onclick=function(){ stopSpeak(); ix=(ix+1)%pool.length;
      replace(render,'聽讀跟讀',color); };
    async function loop(){
      if(stopped||!playing) return;
      await speak(sayOf(item));
      if(stopped||!playing) return;
      await sleep(S.pace*1000);              /* 留白給你跟著念 */
      if(stopped||!playing) return;
      await speak(sayOf(item), Math.max(0.6,S.rate-0.1));
      if(stopped||!playing) return;
      await sleep(900);
      if(stopped||!playing) return;
      if(mark(item.i,true).levelUp) gained++;
      ix++;
      if(ix>=pool.length){ wake(false); showResult(pool.length,pool.length,[],'聽讀跟讀',color,gained,ctx); }
      else replace(render,'聽讀跟讀',color);
    }
    autoStop=function(){ stopped=true; };
    wake(true); sync();
    setTimeout(function(){ prime(); loop(); }, 400);
    return d;
  }
  go(render,'聽讀跟讀',color);
}

function dialogPickScreen(){

/* 店員一個聲音、你一個聲音。有兩個日文語音就各用一個，只有一個就用音調區分。 */
function roleOpt(who){
  if(!S.roles) return {};
  if(who==='me') return { voice: altVoice||theVoice, pitch: (S.pitch||1) + (altVoice?0:0.16) };
  return { voice: theVoice, pitch: S.pitch||1 };
}
function startDialog(dg){
  var col = (SC[dg.scene]||{}).color || '';
  var ti=0, right=0, asked=0, log=[];
  function render(){
    var h='<div class="scenesetup zh">'+esc(dg.sub)+'</div><div class="chat" id="chat"></div>'+
      '<div id="area"></div><div class="spacer"></div>';
    var d=screen(h);
    var chat=d.querySelector('#chat'), area=d.querySelector('#area');
    /* 中文預設蓋住，不然眼睛會直接跳過日文去讀中文，等於沒在練聽 */
    function bubble(side, j, z, wrong, open, bubbleSrc){
      bubbleSrc = bubbleSrc || {j:j};
      var b=document.createElement('div');
      b.className='bub '+(side==='them'?'them':'me')+(wrong?' wrong':'');
      var shown = S.dlgZh || !!open;
      b.innerHTML='<div class="j">'+jpHTML(j)+'</div>'+
        '<div class="z zh"'+(shown?'':' hidden')+'>'+esc(z)+'</div>'+
        '<div class="bact">'+
          (side==='them'?'<button class="spk" data-a="say">'+SVG.small+' 再聽</button>':'')+
          (shown?'':'<button class="spk" data-a="zh">看中文</button>')+
        '</div>';
      b.querySelectorAll('.spk').forEach(function(btn){
        btn.onclick=function(){
          if(btn.dataset.a==='say'){ speak(sayOf(bubbleSrc), null, roleOpt(side)); }
          else { b.querySelector('.z').hidden=false; btn.remove(); }
        };
      });
      chat.appendChild(b);
      b.scrollIntoView({block:'nearest',behavior:'smooth'});
      return b;
    }
    function revealAll(){
      chat.querySelectorAll('.bub').forEach(function(b){
        var z=b.querySelector('.z'); if(z) z.hidden=false;
        var h=b.querySelector('[data-a="zh"]'); if(h) h.remove();
      });
    }
    log.forEach(function(L){ bubble(L.side,L.j,L.z,L.wrong,L.open,L.src); });
    function step(){
      if(ti>=dg.turns.length){
        area.innerHTML='<div class="verdict '+(right===asked?'ok':'mid')+'" style="margin:14px 0">'+
          '<span class="mk">'+(right===asked?'✓':'～')+'</span>這個場景走完了：'+right+' / '+asked+' 題答對</div>'+
          '<div class="row"><button class="btn ghost" id="ag">再走一次</button>'+
          '<button class="btn primary" id="hm">換一個場景</button></div>';
        area.querySelector('#ag').onclick=function(){ ti=0;right=0;asked=0;log=[]; replace(render,dg.title,col); };
        area.querySelector('#hm').onclick=function(){ back(); };
        return;
      }
      var t=dg.turns[ti];
      if(t.who==='clerk'){
        log.push({side:'them',j:t.j,z:t.z,src:t});
        bubble('them',t.j,t.z,false,false,t);
        speak(sayOf(t), null, roleOpt('them'));
        ti++;
        setTimeout(step, 1100);
        return;
      }
      asked++;
      var opts=shuffle(t.opts);
      var h2='<div class="qrow"><div class="eyebrow">'+esc(t.q)+'</div>'+
        (S.dlgZh?'':'<button class="hintbtn" id="hint">提示・看中文</button>')+'</div><div class="opts">';
      opts.forEach(function(o,n){
        h2+='<button class="opt" data-n="'+t.opts.indexOf(o)+'"><span class="k">'+(n+1)+'</span>'+
          '<span class="txt"><span class="jp" lang="ja">'+jpHTML(o.j)+'</span>'+
          '<span class="ozh zh"'+(S.dlgZh?'':' hidden')+'>'+esc(o.z)+'</span></span></button>';
      });
      h2+='</div><div id="fb"></div>';
      area.innerHTML=h2;
      var hintBtn = area.querySelector('#hint');
      if(hintBtn) hintBtn.onclick=function(){
        area.querySelectorAll('.ozh').forEach(function(z){ z.hidden=false; });
        revealAll(); hintBtn.remove();
      };
      area.querySelectorAll('.opt').forEach(function(b){
        b.onclick=function(){
          var o=t.opts[+b.dataset.n], good=!!o.ok;
          if(good) right++;
          countDay();
          sfxFor(good?'good':'bad');
          area.querySelectorAll('.opt').forEach(function(x){
            var ox=t.opts[+x.dataset.n];
            if(ox.ok) x.classList.add('good'); else if(x===b) x.classList.add('bad'); else x.classList.add('dim');
          });
          /* 答完才把所有中文攤開 */
          area.querySelectorAll('.ozh').forEach(function(z){ z.hidden=false; });
          if(hintBtn) hintBtn.remove();
          revealAll();
          log.forEach(function(L){ L.open=true; });
          log.push({side:'me',j:o.j,z:o.z,wrong:!good,open:true,src:o});
          bubble('me',o.j,o.z,!good,true,o);
          setTimeout(function(){ speak(sayOf(o), null, roleOpt('me')); }, 430);
          var corr = t.opts.filter(function(x){return x.ok;})[0];
          var fh='<div class="grow">'+guide(good?'good':'bad','sm')+'<div class="gtext">'+
            '<div class="verdict '+(good?'ok':'no')+'">'+
            '<span class="mk">'+(good?'✓':'✕')+'</span>'+(good?'這樣回就對了':'這句不太對')+'</div></div></div>';
          if(!good && o.why) fh+='<div class="note zh"><b>為什麼不行：</b>'+esc(o.why)+'</div>';
          if(!good) fh+='<div class="note zh" style="margin-top:8px"><b>應該說：</b><span class="jp" lang="ja">'+
            jpHTML(corr.j)+'</span>（'+esc(corr.z)+'）</div>';
          if(corr.note) fh+='<div class="note zh" style="margin-top:8px">'+esc(corr.note)+'</div>';
          fh+='<button class="btn primary" id="go" style="margin-top:12px">繼續</button>';
          area.querySelector('#fb').innerHTML=fh;
          area.querySelector('#go').onclick=function(){ ti++; step(); };
          setTimeout(function(){ area.querySelector('#fb').scrollIntoView({block:'nearest',behavior:'smooth'}); },60);
        };
      });
    }
    setTimeout(step,300);
    return d;
  }
  go(render,dg.title,col);
}

function startPair(p, col){

/* ══════════ 結果 ══════════ */
function showResult(right,total,wrong,title,color,gained,ctx){
  ctx = ctx || {}; gained = gained || 0;
  replace(function(){
    var pct = total? Math.round(right/total*100):0;
    var t = tally();
    /* 分數低的時候給中性的待機表情，不給沮喪臉——答得差已經夠難受了 */
    var mood = (ctx.kind==='check' && pct>=80) || pct===100 ? 'cele'
             : pct>=80 ? 'streak' : pct>=60 ? 'good' : 'idle';
    var h='<div class="card score">'+guide(mood,'lg')+'<div class="pct">'+pct+'%</div>'+
      '<div class="lbl">'+total+' 題中答對 '+right+' 題</div></div>';

    /* 這一輪到底換到了什麼 —— 不是只給一個分數就結束 */
    if(ctx.kind==='check'){
      h += '<div class="banner good"><span class="ic">✓</span><div>'+
        (pct>=80
          ? '驗收通過。答對的那些句子已經升到<b>已精通</b>，表示你是真的記住了，不是剛好猜對。'
          : '有幾句還不太穩，已經退回「學習中」排進複習。這很正常，再練一輪就回來了。')+
        '</div></div>';
    } else if(gained){
      h += '<div class="banner good"><span class="ic">✓</span><div>這一輪你<b>新學會 '+gained+' 句</b>。</div></div>';
    }

    h += '<div class="card progwrap">'+
      '<div class="prow"><span class="plabel">累計進度</span>'+
        '<span class="pnum">'+t.known+' <span class="muted">/ '+t.total+' 句已學會</span></span></div>'+
      progBar(t)+progLegend(t)+'</div>';

    if(wrong && wrong.length){
      h+='<div class="eyebrow">這幾句再看一次</div><div class="wronglist">';
      wrong.slice(0,6).forEach(function(w){
        h+='<div class="wrongrow"><div class="b"><div class="j jp">'+jpHTML(w.j)+'</div>'+
          '<div class="z zh">'+esc(w.z)+'</div></div>'+
          '<button data-i="'+w.i+'">'+SVG.small+'</button></div>';
      });
      h+='</div><div class="note zh">'+
        (wrong.length>6 ? '另外還有 '+(wrong.length-6)+' 句，' : '')+
        '這些已經收進「錯題複習」，之後會自動排回來給你練，不用自己記。</div>';
    }

    var left = ctx.sel ? freshLeft(ctx.sel, ctx.mode) : 0;
    h+='<div class="spacer"></div>';
    if(ctx.kind==='round'){
      h += '<div class="note zh" style="margin-bottom:10px">'+
        (left ? '這些情境還有 <b>'+left+' 句</b>沒練過。' : '這些情境的句子都練過一輪了，接下來會以複習為主。')+
        '</div><button class="btn primary" id="next">繼續下一輪（第 '+((ctx.round||1)+1)+' 輪）</button>'+
        '<div class="row" style="margin-top:9px">'+
        (wrong && wrong.length ? '<button class="btn ghost" id="again">只練錯的</button>' : '')+
        '<button class="btn ghost" id="home">回首頁</button></div>';
    } else {
      h += '<div class="row">'+
        (wrong && wrong.length ? '<button class="btn ghost" id="again">只練錯的</button>' : '')+
        '<button class="btn primary" id="home">回首頁</button></div>';
    }
    var d=screen(h);
    sfxFor(mood==='idle'?'':mood);
    d.querySelectorAll('.wrongrow button').forEach(function(b){
      b.onclick=function(){ speak(sayOf(BY_ID[b.dataset.i])); }; });
    var nx = d.querySelector('#next');
    if(nx) nx.onclick=function(){ prime(); startRound(ctx.sel, ctx.mode, (ctx.round||1)+1); };
    var ag = d.querySelector('#again');
    if(ag) ag.onclick=function(){ prime(); startQuiz(shuffle(wrong),'mix',title+'・錯題',color,{kind:'retry'}); };
    d.querySelector('#home').onclick=function(){ nav=[{r:homeScreen,t:'日本旅行會話',c:''}]; draw(); };
    return d;
  }, '練習結果', color);
}
function showSpeakResult(great,total,results,color,gained,ctx){
  ctx = ctx || {}; gained = gained || 0;
  replace(function(){
    var pct= total?Math.round(great/total*100):0;
    var mood = pct===100 ? 'cele' : pct>=80 ? 'streak' : pct>=60 ? 'good' : 'idle';
    var h='<div class="card score">'+guide(mood,'lg')+'<div class="pct">'+pct+'%</div>'+
      '<div class="lbl">'+total+' 句中念對 '+great+' 句</div></div>';
    var low = results.filter(function(r){ return r.score<0.86; });
    if(low.length){
      h+='<div class="eyebrow">這幾句再練</div><div class="wronglist">';
      low.forEach(function(r){
        h+='<div class="wrongrow"><div class="b"><div class="j jp">'+jpHTML(r.item.j)+'</div>'+
          '<div class="z zh">'+esc(r.item.z)+(r.heard?' ・辨識到「'+esc(r.heard)+'」':'')+'</div></div>'+
          '<button data-i="'+r.item.i+'">'+SVG.small+'</button></div>';
      });
      h+='</div>';
    } else h+='<div class="banner good"><span class="ic">✓</span><div>這一輪都念對了。</div></div>';
    if(gained) h+='<div class="banner good"><span class="ic">✓</span><div>這一輪你<b>新學會 '+gained+' 句</b>。</div></div>';
    var t = tally();
    h += '<div class="card progwrap">'+
      '<div class="prow"><span class="plabel">累計進度</span>'+
        '<span class="pnum">'+t.known+' <span class="muted">/ '+t.total+' 句已學會</span></span></div>'+
      progBar(t)+'</div>';
    h+='<div class="spacer"></div>';
    if(ctx.kind==='round'){
      var left = freshLeft(ctx.sel, ctx.mode);
      h += '<div class="note zh" style="margin-bottom:10px">'+
        (left ? '這些情境還有 <b>'+left+' 句</b>沒練過。' : '這些情境都練過一輪了。')+'</div>'+
        '<button class="btn primary" id="next">繼續下一輪（第 '+((ctx.round||1)+1)+' 輪）</button>'+
        '<div class="row" style="margin-top:9px"><button class="btn ghost" id="home">回首頁</button></div>';
    } else {
      h += '<button class="btn primary" id="home">回首頁</button>';
    }
    var d=screen(h);
    d.querySelectorAll('.wrongrow button').forEach(function(b){
      b.onclick=function(){ speak(sayOf(BY_ID[b.dataset.i])); }; });
    var nx=d.querySelector('#next');
    if(nx) nx.onclick=function(){ prime(); startRound(ctx.sel, ctx.mode, (ctx.round||1)+1); };
    d.querySelector('#home').onclick=function(){ nav=[{r:homeScreen,t:'日本旅行會話',c:''}]; draw(); };
    return d;
  },'口說結果',color);
}

/* ══════════ 設定 ══════════ */
var SHEET=el('sheet'), PANEL=el('sheetPanel');
el('btnSet').onclick=function(){ prime(); openSheet(); };
SHEET.onclick=function(e){ if(e.target===SHEET) closeSheet(); };
function closeSheet(){ SHEET.hidden=true; stopSpeak(); }
function openSheet(focus){
  loadVoices();
  var env = location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1';
  var net = voicesJa.filter(isNetVoice).length;
  var h='<div class="grab"></div><h2>設定</h2>';

  /* 「聽起來像機器人」幾乎都是因為手機用的是本機壓縮語音，而不是網路神經語音 */
  h+='<div class="set" id="sVoice"><label>日文語音</label>';
  if(!voicesJa.length){
    h+='<div class="hint">還沒偵測到日文語音。<br>'+
       '<b>Android</b>：設定 → 系統 → 語言與輸入 → 文字轉語音輸出 → Google 文字轉語音 → 安裝語音資料 → 日本語。<br>'+
       '<b>iPhone</b>：設定 → 輔助使用 → 朗讀內容 → 語音 → 日文。<br>'+
       '<b>Windows</b>：設定 → 時間與語言 → 語音 → 新增日文。<br>裝好後重新整理這個頁面。</div>';
  } else {
    h+='<button class="btn primary" id="vwiz" style="margin-bottom:4px">聽一句，幫我挑最好的語音</button>';
    h+='<div class="voicelist">';
    voicesJa.forEach(function(v,n){
      var sel = theVoice && v.voiceURI===theVoice.voiceURI, nv = isNetVoice(v);
      h+='<div class="vrow'+(sel?' sel':'')+'" data-u="'+esc(v.voiceURI)+'">'+
        '<span class="vn">'+esc(v.name||v.lang)+
          '<span class="vq'+(nv?' net':'')+'">'+voiceTag(v)+'</span></span>'+
        (n===0?'<span class="tag">建議</span>':'')+
        '<button data-act="try">試聽</button>'+
        '<button data-act="use">'+(sel?'使用中':'選用')+'</button></div>';
    });
    h+='</div>';
    if(!net) h+='<div class="banner" style="margin-top:8px"><span class="ic">！</span><div>'+
      '這台手機目前只有<b>本機語音</b>，那是壓縮過的小模型，聽起來就是機器人。<br><br>'+
      '要換成接近真人的網路語音：<b>設定 → 系統 → 語言與輸入 → 文字轉語音輸出</b>，'+
      '引擎選「Google 文字轉語音」，點旁邊的齒輪 → <b>安裝語音資料 → 日本語</b>，'+
      '把清單裡標示較大檔案的那幾個（通常寫著「高品質」或下載圖示）裝起來，'+
      '並把「<b>使用網路語音</b>」打開。回來重新整理這個頁面就會多出選項。</div></div>';
    else h+='<div class="hint">標「網路・自然」的是神經語音，接近真人；標「本機」的是壓縮模型，'+
      '沒網路時才建議用。聽不習慣就換一個試試，設定會記住。</div>';
  }
  h+='</div>';

  h+='<div class="set"><label>日文顯示方式</label><div class="seg" id="segD">'+
     '<button data-v="kanji" aria-pressed="'+(S.display==='kanji')+'">漢字＋假名</button>'+
     '<button data-v="kana" aria-pressed="'+(S.display==='kana')+'">純假名</button></div></div>';

  h+='<div class="set"><label>朗讀語速</label><div class="seg" id="segR">'+
     [['0.65','很慢'],['0.8','慢'],['0.95','正常'],['1.1','快']].map(function(r){
       return '<button data-v="'+r[0]+'" aria-pressed="'+(String(S.rate)===r[0])+'">'+r[1]+'</button>';
     }).join('')+'</div></div>';

  h+='<div class="set"><label>聲音高低</label><div class="seg" id="segT">'+
     [['0.85','低沉'],['1','標準'],['1.2','輕快'],['1.35','更高']].map(function(r){
       return '<button data-v="'+r[0]+'" aria-pressed="'+(String(S.pitch)===r[0])+'">'+r[1]+'</button>';
     }).join('')+'</div><div class="hint">調高會比較像卡通角色的語氣。超過這個範圍就會開始像變聲器，所以我沒有開放更高。</div></div>';

  h+='<div class="set"><label>每輪題數</label><div class="seg" id="segC">'+
     [['10','10'],['15','15'],['25','25'],['0','全部']].map(function(r){
       return '<button data-v="'+r[0]+'" aria-pressed="'+(String(S.count)===r[0])+'">'+r[1]+'</button>';
     }).join('')+'</div></div>';

  h+='<div class="set"><label>跟讀留白</label><div class="seg" id="segP">'+
     [['2.2','短'],['3.2','中'],['4.5','長']].map(function(r){
       return '<button data-v="'+r[0]+'" aria-pressed="'+(String(S.pace)===r[0])+'">'+r[1]+'</button>';
     }).join('')+'</div><div class="hint">跟讀模式播完一句後，留給你跟著念的時間。</div></div>';

  h+='<div class="set"><label>練習行為</label>'+
     '<div class="sw"><div class="l"><strong>口說免持模式</strong>'+
     '<em>播範讀 → 嗶聲 → 自動開麥 → 判定 → 自動下一句，整輪手不用碰螢幕。</em></div>'+
     '<button class="toggle" id="tgH" aria-pressed="'+(S.hands?'true':'false')+'" aria-label="免持模式"></button></div>'+
     '<div class="sw"><div class="l"><strong>口說前先播範讀</strong>'+
     '<em>關掉就變成真正的測驗：只看中文，自己想怎麼講。</em></div>'+
     '<button class="toggle" id="tgM" aria-pressed="'+(S.model?'true':'false')+'" aria-label="範讀"></button></div>'+
     '<div class="sw"><div class="l"><strong>答對答錯的音效</strong>'+
     '<em>答對是往上的三個音，答錯是 ㄅㄟㄅㄟ 的蜂鳴聲。即時合成，離線一樣有聲音。</em></div>'+
     '<button class="toggle" id="tgF" aria-pressed="'+(S.sfx?'true':'false')+'" aria-label="音效"></button></div>'+
     '<div class="sw"><div class="l"><strong>顯示嚮導プク</strong>'+
     '<em>答題、對話、結算畫面會出現的那隻河豚。關掉就只剩文字。</em></div>'+
     '<button class="toggle" id="tgG" aria-pressed="'+(S.guide?'true':'false')+'" aria-label="嚮導"></button></div>'+
     '<div class="sw"><div class="l"><strong>對話用兩個角色的聲音</strong>'+
     '<em>情境模擬裡店員和你用不同的聲音。這台裝置有兩個以上日文語音就各用一個，只有一個就用音調區分。</em></div>'+
     '<button class="toggle" id="tgR" aria-pressed="'+(S.roles?'true':'false')+'" aria-label="角色聲音"></button></div>'+
     '<div class="sw"><div class="l"><strong>情境模擬直接顯示中文</strong>'+
     '<em>預設關閉：先只看日文，看不懂再按「提示」，答完會自動攤開全部中文。打開就一律顯示。</em></div>'+
     '<button class="toggle" id="tgZ" aria-pressed="'+(S.dlgZh?'true':'false')+'" aria-label="對話顯示中文"></button></div>'+
     '<div class="sw"><div class="l"><strong>嚴格判定</strong>'+
     '<em>開啟後助詞念錯就算沒過，適合已經練熟想抓細節的時候。</em></div>'+
     '<button class="toggle" id="tgS" aria-pressed="'+(S.strict?'true':'false')+'" aria-label="嚴格判定"></button></div></div>';

  h+='<div class="set"><label>這台裝置的支援狀況</label>'+
     '<div class="hint">'+
     '朗讀：'+(TTS_OK?(voicesJa.length?('可用 ・ 偵測到 '+voicesJa.length+' 個日文語音'):'可用，但尚未偵測到日文語音'):'不支援')+'<br>'+
     '語音辨識：'+(!ASR_PRESENT?'這個瀏覽器不支援':(asrBlocked?'被環境擋住（會自動切成自評）':(env?'可用':'目前網址不是 https 或 localhost，麥克風會被擋')))+'<br>'+
     '螢幕恆亮：'+(('wakeLock' in navigator)?'可用':'不支援（請自己把螢幕休眠時間調長）')+
     '</div></div>';

  h+='<div class="set"><button class="btn ghost" id="reset">清除練習紀錄</button></div>'+
     '<button class="btn primary" id="close">完成</button>';

  PANEL.innerHTML=h; SHEET.hidden=false;
  function seg(id,key,cast){
    var w=PANEL.querySelector(id); if(!w) return;
    w.querySelectorAll('button').forEach(function(b){
      b.onclick=function(){
        S[key]=cast(b.dataset.v); saveSet();
        w.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed', x===b?'true':'false'); });
      };
    });
  }
  seg('#segD','display',String); seg('#segR','rate',Number);
  seg('#segC','count',Number);   seg('#segP','pace',Number);
  seg('#segT','pitch',Number);
  var segT = PANEL.querySelector('#segT');
  if(segT) segT.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click', function(){ speak('すみません、ちょっといいですか。'); });
  });
  function tog(id,key){ var b=PANEL.querySelector(id); if(!b) return;
    b.onclick=function(){ S[key]=!S[key]; saveSet(); b.setAttribute('aria-pressed',S[key]?'true':'false'); }; }
  tog('#tgH','hands'); tog('#tgM','model'); tog('#tgS','strict'); tog('#tgZ','dlgZh'); tog('#tgR','roles');
  tog('#tgF','sfx'); tog('#tgG','guide');
  PANEL.querySelectorAll('.vrow button').forEach(function(b){
    b.onclick=function(){
      var row=b.parentNode, uri=row.dataset.u, v=null;
      voicesJa.forEach(function(x){ if(x.voiceURI===uri) v=x; });
      if(!v) return;
      if(b.dataset.act==='try'){
        var prev=theVoice; theVoice=v;
        speak('すみません、駅はどこですか。').then(function(){ theVoice = prev || v; });
      } else {
        S.voice=uri; S.voiceOK=1; saveSet(); theVoice=v;
        PANEL.querySelectorAll('.vrow').forEach(function(r){
          var on = r.dataset.u===uri;
          r.classList.toggle('sel',on);
          var ub=r.querySelector('[data-act="use"]'); if(ub) ub.textContent = on?'使用中':'選用';
        });
        speak('ありがとうございます。');
      }
    };
  });

  /* 語音精靈：放一句真的會用到的話，聽不清楚就換下一個，不用自己讀名字猜 */
  var wiz = PANEL.querySelector('#vwiz');
  if(wiz) wiz.onclick=function(){
    var idx = 0, SAMPLE = 'すみません、駅はどこですか。';
    voicesJa.forEach(function(v,n){ if(theVoice && v.voiceURI===theVoice.voiceURI) idx=n; });
    var box = document.createElement('div');
    box.className = 'wiz';
    wiz.replaceWith(box);
    function show(){
      var v = voicesJa[idx];
      theVoice = v;
      box.innerHTML = '<div class="wtop"><b>'+esc(v.name||v.lang)+'</b>'+
        '<span class="vq'+(isNetVoice(v)?' net':'')+'">'+voiceTag(v)+'</span></div>'+
        '<div class="wsample jp">すみません、{駅|えき}はどこですか。</div>'.replace(RUBY,
          S.display==='kana' ? '$2' : '<ruby>$1<rt>$2</rt></ruby>')+
        '<div class="wask zh">這句聽得清楚嗎？</div>'+
        '<div class="row"><button class="btn ghost" id="wno">聽不清楚，換下一個</button>'+
        '<button class="btn primary" id="wyes">就用這個</button></div>'+
        '<div class="hint">'+(idx+1)+' / '+voicesJa.length+' 個日文語音</div>';
      speak(SAMPLE);
      box.querySelector('#wyes').onclick=function(){
        S.voice=v.voiceURI; S.voiceOK=1; saveSet();
        box.innerHTML='<div class="banner good"><span class="ic">✓</span><div>好，之後都用 <b>'+
          esc(v.name||v.lang)+'</b>。隨時可以回到這裡換。</div></div>';
      };
      box.querySelector('#wno').onclick=function(){
        if(idx+1 < voicesJa.length){ idx++; show(); }
        else {
          box.innerHTML='<div class="banner"><span class="ic">！</span><div>'+
            '這台手機上的日文語音都試過了。如果每個都覺得機械，表示系統只裝了本機語音——'+
            '到「<b>設定 → 系統 → 語言與輸入 → 文字轉語音輸出</b>」，引擎選 Google 文字轉語音，'+
            '點齒輪 → <b>安裝語音資料 → 日本語</b>，把高品質的那幾個下載下來，'+
            '並開啟「<b>使用網路語音</b>」，再回來重新整理這頁。</div></div>';
          S.voiceOK=1; saveSet();
        }
      };
    }
    show();
  };

  PANEL.querySelector('#reset').onclick=function(){
    P={}; ST={days:{},streak:0,last:''}; saveProg(); saveStats();
    PANEL.querySelector('#reset').textContent='已清除';
    if(nav.length===1) draw();
  };
  PANEL.querySelector('#close').onclick=closeSheet;
  if(focus==='voice'){
    var sv = PANEL.querySelector('#sVoice');
    if(sv) setTimeout(function(){ sv.scrollIntoView({block:'start',behavior:'smooth'}); }, 80);
  }
}

/* ══════════ 啟動 ══════════ */
var autoStop = function(){};
document.addEventListener('keydown',function(e){
  if(SHEET.hidden===false) return;
  var n = parseInt(e.key,10);
  if(n>=1&&n<=4){ var b=MAIN.querySelectorAll('.opt')[n-1]; if(b&&b.tagName==='BUTTON') b.click(); }
  if(e.key==='Escape'&&nav.length>1) back();
});
nav=[{r:homeScreen,t:'日本旅行會話',c:''}];
draw();
})();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function () {});
  });
}
