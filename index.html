<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B6FA4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="日文會話">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif;background:#fafaf9}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>日本旅行會話練習</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 版面概念：日本車站告示板 —— 左側線路色條、資訊分層、大字可遠讀；下方為拇指操作區 */
:root{
  --bg:#EEF1F4;            /* 偏藍的紙灰，不用純白 */
  --surface:#FFFFFF;
  --surface-2:#F6F8FA;
  --fg:#101720;
  --muted:#5C6773;
  --line:#D9E0E7;
  --accent:#0B6FA4;        /* 站名牌藍 */
  --accent-ink:#FFFFFF;
  --ok:#1C8A57;
  --bad:#C4122F;           /* 朱 */
  --warn:#9A6B00;
  --scene:#0B6FA4;
  --shadow:0 1px 2px rgba(16,23,32,.06), 0 6px 20px rgba(16,23,32,.07);
  --r:14px;
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --zh:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",sans-serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1118;
    --surface:#151C25;
    --surface-2:#1C242F;
    --fg:#E9EEF4;
    --muted:#95A3B3;
    --line:#28323F;
    --accent:#52B2DE;
    --accent-ink:#06121B;
    --ok:#44C286;
    --bad:#FF7A86;
    --warn:#E0B458;
    --scene:#52B2DE;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1118; --surface:#151C25; --surface-2:#1C242F; --fg:#E9EEF4; --muted:#95A3B3;
  --line:#28323F; --accent:#52B2DE; --accent-ink:#06121B; --ok:#44C286; --bad:#FF7A86;
  --warn:#E0B458; --scene:#52B2DE;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);
  -webkit-text-size-adjust:100%;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto;
  background:var(--bg);position:relative}

/* ── 頂部列 ── */
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
  background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar .rail{width:5px;height:24px;border-radius:3px;background:var(--scene);flex:none}
.bar-title{display:flex;align-items:center;gap:9px;flex:1;min-width:0;
  font-weight:700;font-size:16px;letter-spacing:.01em}
.bar-title span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{background:none;border:1px solid var(--line);border-radius:10px;width:38px;height:38px;
  display:grid;place-items:center;flex:none;color:var(--muted);padding:0}
.iconbtn:hover{color:var(--fg);border-color:var(--muted)}
.iconbtn svg{width:19px;height:19px;display:block}

main{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.screen{display:flex;flex-direction:column;gap:14px;padding:18px 16px;
  padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));min-height:100%}

/* ── 共用 ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.jp{font-family:var(--jp);font-feature-settings:"palt" 1}
.zh{font-family:var(--zh)}
h1{font-size:21px;margin:0;font-weight:700;letter-spacing:.01em;text-wrap:balance}
h2{font-size:15px;margin:0;font-weight:700}
ruby rt{font-size:.48em;font-weight:400;opacity:.78;letter-spacing:0}

.btn{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:15px 16px;box-shadow:var(--shadow);transition:transform .08s,border-color .15s}
.btn:active{transform:scale(.985)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;
  text-align:center;font-weight:700;font-size:16px}
.btn.ghost{background:var(--surface-2);box-shadow:none;text-align:center;font-weight:600}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}

/* ── 首頁 ── */
.hero{display:flex;flex-direction:column;gap:5px}
.hero .t{font-family:var(--jp);font-size:27px;font-weight:700;letter-spacing:.02em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stat{background:var(--surface);padding:12px 10px;text-align:center}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.25}
.stat span{font-size:11px;color:var(--muted)}
.progwrap{padding:15px 16px;display:flex;flex-direction:column;gap:10px}
.prow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.plabel{font-size:12px;letter-spacing:.1em;color:var(--muted);font-weight:700}
.pnum{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.pbar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--line)}
.pbar .seg{display:block;height:100%;transition:width .4s}
.seg.master{background:var(--ok)} .seg.known{background:var(--accent)} .seg.doing{background:var(--warn)}
/* 兩段顏色交界處補一條細細的分隔，深綠接深藍才不會糊成一塊 */
.pbar .seg+.seg{box-shadow:inset 1px 0 0 rgba(255,255,255,.55)}
.plegend{display:flex;flex-wrap:wrap;gap:14px;font-size:11.5px;color:var(--muted);
  font-variant-numeric:tabular-nums}
.plegend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.known{background:var(--accent)} .dot.doing{background:var(--warn)} .dot.master{background:var(--ok)}
.badge{display:inline-block;margin-left:7px;min-width:20px;padding:1px 6px;border-radius:9px;
  background:var(--warn);color:#fff;font-size:11px;font-weight:700;vertical-align:1px;
  font-variant-numeric:tabular-nums}
.modes{display:flex;flex-direction:column;gap:9px}
.mode{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:14px 15px;box-shadow:var(--shadow)}
.mode .n{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  font-family:var(--jp);font-size:15px;font-weight:700;background:var(--surface-2);color:var(--mc,var(--accent));
  border:1px solid var(--line)}
.mode .b{flex:1;min-width:0}
.mode .b strong{display:block;font-size:15.5px;font-weight:700}
.mode .b em{display:block;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:2px}
.mode .chev{flex:none;color:var(--muted)}

/* ── 情境選單 ── */
/* 分類選單的「會話句型 / 生活單字」兩個可收合區塊 */
.grp{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;margin-bottom:10px}
.grph{display:flex;align-items:flex-start;gap:10px;width:100%;padding:13px;background:none;border:0;
  text-align:left;cursor:pointer;font:inherit;color:inherit}
.gchev{flex:none;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);
  transform:rotate(45deg);transition:transform .2s;margin:6px 2px 0 1px}
.grp[data-shut] .gchev{transform:rotate(-45deg)}
.gtx{flex:1;min-width:0;font-family:var(--zh)}
.gtx strong{display:block;font-size:15px;font-weight:700}
.gtx em{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.gbar{display:flex;height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:7px;max-width:210px}
/* 細進度條的三段配色，和首頁大進度條一致 */
.mseg{display:block;height:100%;transition:width .4s}
.mseg.master{background:var(--ok)} .mseg.known{background:var(--accent)} .mseg.doing{background:var(--warn)}
.mseg+.mseg{box-shadow:inset 1px 0 0 rgba(255,255,255,.6)}
.gnum{margin-top:4px!important;font-size:11px!important}
.gcnt{flex:none;margin-top:2px;font-family:var(--zh);font-size:11px;font-weight:700;color:var(--muted);
  background:var(--surface-2);border-radius:999px;padding:4px 9px;white-space:nowrap}
.gcnt.on{color:var(--accent-ink);background:var(--accent)}
.gbody{padding:0 11px 12px}
.grp[data-shut] .gbody{display:none}
.row.tight{gap:8px;margin-bottom:9px}
.btn.ghost.sm{padding:7px 10px;font-size:12px;border-radius:10px;flex:1}
.scenes{display:flex;flex-direction:column;gap:8px}
.scene{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.scene .bar2{width:5px;align-self:stretch;min-height:34px;border-radius:3px;background:var(--sc)}
.scene .b{flex:1;min-width:0}
.scene .b strong{display:block;font-size:15px}
.scene .b em{display:block;font-style:normal;font-family:var(--zh);font-size:11.5px;color:var(--muted);
  margin-top:2px;font-variant-numeric:tabular-nums}
.smini{display:flex;height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:6px;max-width:190px}
.scene .cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.scene[aria-pressed="true"]{border-color:var(--sc);background:var(--surface-2)}
.scene .tick{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.scene[aria-pressed="true"] .tick{background:var(--sc);border-color:var(--sc)}
.scene[aria-pressed="true"] .tick::after{content:"";width:6px;height:10px;border:2px solid #fff;
  border-top:0;border-left:0;transform:rotate(42deg) translate(-1px,-1px)}

/* ── 練習 ── */
.prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);
  font-variant-numeric:tabular-nums}
.prog .track{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.prog .fill{height:100%;background:var(--scene);transition:width .25s}
.prog .lvl{font-weight:700;font-size:11.5px;white-space:nowrap}
.row2{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.lvlup{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:10px;padding:10px 13px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:10px;font-size:12.5px}
.lvlup b{font-size:13px}
.pips{display:inline-flex;gap:3px}
.pip{width:7px;height:7px;border-radius:50%;background:var(--line);display:block}
.arrow{color:var(--muted)}

.stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:22px 18px;display:flex;flex-direction:column;
  align-items:center;gap:14px;text-align:center;border-top:4px solid var(--scene)}
.stage .ask{font-size:13px;color:var(--muted);letter-spacing:.02em}
.stage .big-jp{font-family:var(--jp);font-size:clamp(23px,6.4vw,31px);font-weight:700;
  line-height:2.0;letter-spacing:.015em;text-wrap:balance}
.stage .big-zh{font-family:var(--zh);font-size:clamp(20px,5.4vw,25px);font-weight:600;
  line-height:1.6;text-wrap:balance}
.stage .sub-zh{font-family:var(--zh);font-size:15px;color:var(--muted)}
.stage .sub-jp{font-family:var(--jp);font-size:16px;color:var(--muted);line-height:1.9}

.speaker{width:88px;height:88px;border-radius:50%;border:2px solid var(--scene);
  background:var(--surface-2);display:grid;place-items:center;color:var(--scene);margin:2px 0}
.speaker svg{width:34px;height:34px}
.speaker.playing{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(11,111,164,.0)}50%{box-shadow:0 0 0 12px rgba(11,111,164,.12)}}
.replay{display:inline-flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:999px;padding:8px 15px;font-size:13.5px;font-weight:600;color:var(--muted);width:auto}
.replay svg{width:16px;height:16px}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);
  border:1.5px solid var(--line);border-radius:12px;padding:14px 15px;box-shadow:var(--shadow);
  min-height:58px;transition:transform .08s,border-color .15s,background .15s}
.opt:active{transform:scale(.985)}
.opt .k{flex:none;width:25px;height:25px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.opt .txt{flex:1;min-width:0;font-size:16.5px;line-height:1.75}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 11%,var(--surface))}
.opt.good .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.opt.bad .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.dim{opacity:.45}

.note{border-left:3px solid var(--scene);background:var(--surface-2);border-radius:0 10px 10px 0;
  padding:11px 14px;font-size:13.5px;line-height:1.65;font-family:var(--zh);color:var(--muted)}
.note b{color:var(--fg)}
.verdict{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.verdict .mk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-size:14px;color:#fff;flex:none}
.verdict.ok .mk{background:var(--ok)} .verdict.ok{color:var(--ok)}
.verdict.no .mk{background:var(--bad)} .verdict.no{color:var(--bad)}
.verdict.mid .mk{background:var(--warn)} .verdict.mid{color:var(--warn)}

/* ══════════ JLPT N5 題庫 ══════════ */
.n5card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);
  border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;box-shadow:var(--shadow)}
.n5card:active{transform:scale(.99)}
.n5badge{flex:none;width:46px;height:46px;border-radius:12px;background:#1B6FA8;color:#fff;
  display:grid;place-items:center;font-size:17px;font-weight:700;letter-spacing:.02em}
.n5card .b{flex:1;min-width:0;font-family:var(--zh)}
.n5card .b strong{display:block;font-size:15.5px}
.n5card .b em{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5}
/* 大題清單上的「問題1」小標 */
.n5no{display:inline-block;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;
  padding:1px 7px;font-size:11px;font-weight:700;color:var(--muted);margin-right:7px;vertical-align:1px;
  font-family:var(--zh)}
.scene.n5part .b strong{display:block;font-size:15px}
/* 出題畫面的頂欄與日文作答指示 */
.n5bar{display:flex;align-items:center;gap:8px;font-family:var(--zh);font-size:12px;color:var(--muted)}
.n5bar .n5t{font-weight:700;color:var(--fg);font-size:13px}
.n5bar .n5ix{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700}
.n5jd{font-size:12.5px;color:var(--muted);line-height:1.6;border-left:3px solid var(--scene);
  background:var(--surface-2);border-radius:0 8px 8px 0;padding:8px 12px}
/* 題幹 */
.n5q{font-size:18px;line-height:2.05;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:15px 16px;box-shadow:var(--shadow)}
.n5u{text-underline-offset:5px;text-decoration-thickness:2px;font-weight:700}
.n5star{color:var(--bad);font-size:1.05em}
/* 讀解的文章 */
.n5psg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 16px;
  box-shadow:var(--shadow)}
.n5psg.notice{background:var(--surface-2);border-style:dashed}
.n5psg.seen{max-height:118px;overflow:auto}
.n5psgx{font-size:15.5px;line-height:2.1}
.n5psg.notice .n5psgx{font-size:14.5px;line-height:1.95;white-space:pre-wrap}
.n5zh{background:none;border:0;padding:6px 0 0;font-family:var(--zh);font-size:12px;
  color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.n5zhx{margin-top:7px;padding-top:9px;border-top:1px dashed var(--line);font-size:13px;
  line-height:1.8;color:var(--muted)}
/* 聽解 */
.n5play{display:flex;flex-direction:column;align-items:center;gap:9px;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);text-align:center}
.n5sit{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 16px;
  box-shadow:var(--shadow);text-align:center}
.n5sit .n5sitl{font-family:var(--zh);font-size:11.5px;color:var(--muted);margin-bottom:7px}
.n5sit .jp{font-size:16.5px;line-height:2}
.n5sit .replay{margin-top:10px}
/* 作答後的解說 */
.n5fb{display:flex;gap:11px;align-items:flex-start;border-radius:12px;padding:13px 14px;
  font-family:var(--zh);font-size:13.5px;line-height:1.7}
.n5fb.good{background:color-mix(in srgb,var(--ok) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--ok) 35%,var(--line))}
.n5fb.bad{background:color-mix(in srgb,var(--bad) 7%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 30%,var(--line))}
.n5fb>div{flex:1;min-width:0}
.n5ans{font-size:16px;line-height:2.1;margin-top:5px}
.n5tip{margin-top:5px;color:var(--muted);font-size:12.5px}
/* 組句題排出來的句子，★那一格標起來 */
.n5built{margin-top:7px;font-size:16px;line-height:2.1}
.n5built .n5seg{display:inline-block;border-bottom:2px solid var(--line);padding:0 4px;margin:0 1px}
.n5built .n5seg.star{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent);
  border-radius:5px;font-weight:700;color:var(--bad)}

/* ── N5 模擬測驗 ── */
.n5mock{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:color-mix(in srgb,#B8860B 7%,var(--surface));
  border:1.5px solid color-mix(in srgb,#B8860B 38%,var(--line));
  border-radius:14px;padding:13px 14px;box-shadow:var(--shadow)}
.n5mi{flex:none;width:46px;height:46px;border-radius:12px;background:#B8860B;color:#fff;
  display:grid;place-items:center;font-size:20px;font-weight:700;font-family:var(--jp)}
.n5mock .b{flex:1;min-width:0;font-family:var(--zh)}
.n5mock .b strong{display:block;font-size:15.5px}
.n5mock .b em{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.n5mhero{display:flex;flex-direction:column;align-items:center;gap:7px;padding:20px 16px;text-align:center}
.n5mhero.ok{background:color-mix(in srgb,var(--ok) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--ok) 35%,var(--line))}
.n5mhero.no{background:color-mix(in srgb,var(--bad) 6%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 28%,var(--line))}
.n5mt{font-family:var(--zh);font-size:20px;font-weight:700}
.n5ms{font-size:12.5px;color:var(--muted)}
.n5verd{font-family:var(--zh);font-size:26px;font-weight:700}
.n5mhero.ok .n5verd{color:var(--ok)} .n5mhero.no .n5verd{color:var(--bad)}
.n5total{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.n5total span{font-size:17px;color:var(--muted);font-weight:600}
.n5ready{font-size:12.5px;color:var(--muted);line-height:1.65;margin-top:2px}
.n5rules{display:flex;flex-direction:column;gap:12px;padding:15px 16px;font-family:var(--zh)}
.n5rule b{display:block;font-size:13.5px;margin-bottom:3px}
.n5rule span{display:block;font-size:12px;color:var(--muted);line-height:1.65}
.n5rule .n5warn{color:var(--bad);font-weight:600;margin-top:2px}
/* 考試中的計時列 */
.n5mbar{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:10px;padding:8px 13px;font-family:var(--zh)}
.n5msec{font-size:12.5px;font-weight:700;color:var(--muted)}
.n5clk{margin-left:auto;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--fg)}
.n5clk.low{color:var(--bad);animation:pulse 1s ease-in-out infinite}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.opt.sel .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
/* 成績單 */
.n5sc{padding:11px 0;border-bottom:1px solid var(--line)}
.n5sc:last-child{border-bottom:0}
.n5sch{display:flex;align-items:baseline;gap:8px;font-family:var(--zh);font-size:13px;font-weight:700}
/* 科目名稱可能很長（言語知識（文字・語彙・文法）・讀解），要讓它縮，
   不然右邊的分數和「通過」會被擠出卡片外 */
.n5sch b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n5sch span{flex:none;font-variant-numeric:tabular-nums;white-space:nowrap}
.n5sch em{font-style:normal;font-size:11.5px;color:var(--ok)}
.n5sc.ng .n5sch em{color:var(--bad)}
.n5scb{position:relative;height:9px;border-radius:5px;background:var(--line);overflow:visible;margin:7px 0 5px}
.n5scb i{display:block;height:100%;border-radius:5px;background:var(--ok)}
.n5sc.ng .n5scb i{background:var(--bad)}
.n5scb u{position:absolute;top:-3px;width:2px;height:15px;background:var(--fg);opacity:.55}
.n5scn{font-family:var(--zh);font-size:11px;color:var(--muted)}
.n5parts{padding:13px 15px;display:flex;flex-direction:column;gap:9px}
.n5prow{display:flex;align-items:center;gap:8px;font-family:var(--zh);font-size:12.5px}
.n5pt{flex:none;width:112px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n5pbar{flex:1;height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.n5pbar i{display:block;height:100%;border-radius:4px}
.n5pn{flex:none;font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);width:34px;text-align:right}
.n5skip{font-style:normal;color:var(--warn)}
.n5bad{font-style:normal;color:var(--bad)}

/* ── 口說 ── */
.mic{width:110px;height:110px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;box-shadow:var(--shadow);margin:4px 0}
.mic svg{width:42px;height:42px}
.mic.live{background:var(--bad);animation:live 1.2s ease-in-out infinite}
@keyframes live{0%,100%{box-shadow:0 0 0 0 rgba(196,18,47,.35)}50%{box-shadow:0 0 0 18px rgba(196,18,47,0)}}
.heard{font-family:var(--jp);font-size:19px;line-height:1.85;min-height:30px;word-break:break-all}
.heard .x{color:var(--bad);text-decoration:underline wavy var(--bad);text-underline-offset:4px}
.heard .ok{color:var(--fg)}
.meter{width:100%;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;transition:width .3s}

/* ── 對話 ── */
.chat{display:flex;flex-direction:column;gap:11px}
.bub{max-width:88%;padding:12px 15px;border-radius:15px;box-shadow:var(--shadow);line-height:1.8}
.bub .j{font-family:var(--jp);font-size:17.5px;line-height:2.0}
.bub .z{font-family:var(--zh);font-size:13px;color:var(--muted);margin-top:4px}
.bub.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:5px}
.bub.me .z{color:var(--accent-ink);opacity:.8}
.bub.me.wrong{background:var(--bad)}
.bact{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
.bub .spk{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;
  padding:5px 11px;color:var(--muted);display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600}
.bub.me .spk{background:rgba(255,255,255,.18);border-color:transparent;color:var(--accent-ink)}
.bub .spk svg{width:13px;height:13px}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 9px;flex-wrap:wrap}
.hintbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;
  padding:7px 14px;font-size:12px;font-weight:600;color:var(--muted);flex:none}
.hintbtn:hover{color:var(--fg);border-color:var(--muted)}
.ozh{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.scenesetup{font-family:var(--zh);font-size:13.5px;color:var(--muted);text-align:center;
  padding:9px 12px;background:var(--surface-2);border-radius:10px;line-height:1.6}

/* ── 設定抽屜 ── */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(8,13,19,.5);backdrop-filter:blur(2px)}
.sheet .panel{background:var(--surface);width:100%;max-width:720px;max-height:88%;overflow-y:auto;
  border-radius:18px 18px 0 0;padding:18px 16px;
  padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.grab{width:38px;height:4px;background:var(--line);border-radius:2px;align-self:center}
.set{display:flex;flex-direction:column;gap:8px}
.set>label{font-size:13px;font-weight:700}
.set .hint{font-size:12px;color:var(--muted);line-height:1.6;font-family:var(--zh)}
.seg{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:11px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:0}
.sw .l{flex:1;min-width:0}
.sw .l strong{display:block;font-size:14px}
.sw .l em{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px;font-family:var(--zh);line-height:1.5}
.toggle{flex:none;width:50px;height:30px;border-radius:15px;background:var(--line);border:0;position:relative;transition:background .18s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle[aria-pressed="true"]{background:var(--ok)}
.toggle[aria-pressed="true"]::after{transform:translateX(20px)}
.voicelist{display:flex;flex-direction:column;gap:7px;max-height:230px;overflow-y:auto}
.vrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--surface-2)}
.vrow.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.vrow .vn{flex:1;min-width:0;font-size:13px;overflow:hidden}
.vrow .vn>span.vq{display:block}
.vq{font-size:10.5px;font-weight:700;color:var(--muted);margin-top:2px;letter-spacing:.02em}
.vq.net{color:var(--ok)}
.wiz{display:flex;flex-direction:column;gap:11px;padding:14px;border:1px solid var(--accent);
  border-radius:12px;background:var(--surface-2)}
.wtop{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}
.wtop .vq{margin:0}
.wsample{font-family:var(--jp);font-size:21px;line-height:2;text-align:center}
.wask{font-family:var(--zh);font-size:13px;color:var(--muted);text-align:center}
.vrow .tag{font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:5px;
  background:var(--ok);color:#fff;flex:none}
.vrow button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;
  padding:6px 11px;font-size:12px;font-weight:600}

.banner{display:flex;gap:10px;padding:12px 14px;border-radius:11px;font-size:13px;line-height:1.65;
  font-family:var(--zh);background:color-mix(in srgb,var(--warn) 13%,var(--surface));
  border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));color:var(--fg)}
.banner.good{background:color-mix(in srgb,var(--ok) 11%,var(--surface));
  border-color:color-mix(in srgb,var(--ok) 32%,var(--line))}
.banner .ic{flex:none;font-weight:700;color:var(--warn)}
.banner.good .ic{color:var(--ok)}

/* ── 結果 ── */
.score{text-align:center;padding:26px 18px}
.score .pct{font-size:52px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;color:var(--scene)}
.score .lbl{font-size:13px;color:var(--muted);margin-top:7px}
.wronglist{display:flex;flex-direction:column;gap:8px}
.wrongrow{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);
  border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow)}
.wrongrow .b{flex:1;min-width:0}
.wrongrow .j{font-family:var(--jp);font-size:16px;line-height:1.9}
.wrongrow .z{font-family:var(--zh);font-size:12.5px;color:var(--muted);margin-top:2px}
.wrongrow button{flex:none;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;
  width:38px;height:38px;display:grid;place-items:center;color:var(--muted)}
.wrongrow button svg{width:17px;height:17px}

.pairtip{font-family:var(--zh);font-size:14px;line-height:1.75;background:var(--surface-2);
  border:1px solid var(--line);border-left:4px solid var(--scene);border-radius:0 11px 11px 0;padding:13px 15px}

/* ── 嚮導「プク」 ── */
.guide{display:block;flex:none}
.guide svg{width:100%;height:100%;display:block;overflow:visible}
.g-sm{width:66px;height:83px}
.g-md{width:92px;height:115px}
.g-lg{width:132px;height:165px;margin:0 auto}
.grow{display:flex;align-items:center;gap:13px;margin-top:10px}
.grow .gtext{flex:1;min-width:0}
.hero-row{display:flex;align-items:center;gap:12px}
.hero-row .hero{flex:1;min-width:0}
/* 嚮導佔掉寬度後，標題要縮一點才不會斷在詞中間 */
.hero-row .guide{width:62px;height:78px}
.hero-row .hero .t{font-size:clamp(17px,5.1vw,24px);word-break:keep-all;line-height:1.3}
.rig{transform-box:fill-box;transform-origin:center bottom}
.idle .rig{animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.good-anim .rig{animation:hop .62s cubic-bezier(.3,1.5,.5,1) 1}
@keyframes hop{0%{transform:translateY(0) scale(1,1)}22%{transform:translateY(-22px) scale(.97,1.05)}
  55%{transform:translateY(0) scale(1.05,.95)}75%{transform:translateY(-5px)}100%{transform:translateY(0) scale(1,1)}}
.bad-anim .rig{animation:shake .7s ease-in-out 1}
@keyframes shake{0%,100%{transform:translateX(0) rotate(0)}18%{transform:translateX(-7px) rotate(-3.5deg)}
  38%{transform:translateX(6px) rotate(2.5deg)}58%{transform:translateX(-4px) rotate(-1.5deg)}78%{transform:translateX(3px) rotate(.8deg)}}
.streak-anim .rig{animation:strut 1.1s ease-in-out 1}
@keyframes strut{0%{transform:translateY(0) rotate(0)}25%{transform:translateY(-6px) rotate(-3deg)}
  55%{transform:translateY(0) rotate(2.5deg)}80%{transform:translateY(-3px) rotate(-1deg)}100%{transform:translateY(0) rotate(0)}}
.cele-anim .rig{animation:cheer 1s cubic-bezier(.3,1.4,.5,1) 1}
@keyframes cheer{0%{transform:translateY(0) scale(1)}18%{transform:translateY(-30px) scale(.95,1.08)}
  42%{transform:translateY(0) scale(1.07,.94)}62%{transform:translateY(-18px) scale(.98,1.04)}
  85%{transform:translateY(0) scale(1.03,.98)}100%{transform:translateY(0) scale(1)}}
.puff{transform-box:fill-box;transform-origin:center}
.good-anim .puff{animation:inflate .62s cubic-bezier(.3,1.5,.5,1) 1}
@keyframes inflate{0%{transform:scale(1)}32%{transform:scale(1.15)}70%{transform:scale(.98)}100%{transform:scale(1)}}
.bad-anim .puff{animation:deflate .85s ease-out 1}
@keyframes deflate{0%{transform:scale(1)}16%{transform:scale(.78)}58%{transform:scale(.82)}100%{transform:scale(1)}}
.spikes{transform-box:fill-box;transform-origin:center}
.bad-anim .spikes{animation:spikesin .85s ease-out 1}
@keyframes spikesin{0%{transform:scale(1)}16%{transform:scale(.86)}58%{transform:scale(.88)}100%{transform:scale(1)}}
.good-anim .spikes{animation:spikesout .62s cubic-bezier(.3,1.5,.5,1) 1}
@keyframes spikesout{0%{transform:scale(1)}32%{transform:scale(1.09)}100%{transform:scale(1)}}
.cele-anim .puff{animation:inflate2 1s cubic-bezier(.3,1.4,.5,1) 1}
@keyframes inflate2{0%{transform:scale(1)}20%{transform:scale(1.2)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.gblink{transform-box:fill-box;transform-origin:center}
.idle .gblink{animation:blinkg 4.6s infinite}
@keyframes blinkg{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}97%{transform:scaleY(1)}}
.gmark{transform-box:fill-box;transform-origin:center;animation:gpop .5s cubic-bezier(.2,1.7,.4,1) both}
@keyframes gpop{0%{transform:scale(0) rotate(-24deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.gspark{transform-box:fill-box;transform-origin:center;animation:twink 1.1s ease-out both}
@keyframes twink{0%{transform:scale(0);opacity:0}35%{transform:scale(1.25);opacity:1}100%{transform:scale(.9);opacity:0}}
.gdrop{transform-box:fill-box;transform-origin:center top;animation:slip 1.5s ease-in both}
@keyframes slip{0%{transform:translateY(-6px) scale(.5);opacity:0}25%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(16px) scale(.9);opacity:0}}
.gconf{transform-box:fill-box;transform-origin:center;animation:fall 2s ease-in both}
@keyframes fall{0%{transform:translateY(-30px) rotate(0);opacity:0}15%{opacity:1}100%{transform:translateY(230px) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion: reduce){
  .rig,.gblink,.gmark,.gspark,.gdrop,.puff,.gconf,.spikes{animation:none!important}
}
.spacer{flex:1;min-height:8px}
</style>

</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <button class="iconbtn" id="btnBack" hidden aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="bar-title"><span class="rail"></span><span id="barTitle">日本旅行會話</span></div>
    <button class="iconbtn" id="btnSet" aria-label="設定">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>
  <main id="main"></main>
</div>
<div class="sheet" id="sheet" hidden><div class="panel" id="sheetPanel"></div></div>

<script>
/* 日本旅行會話資料集
   j 欄位用 {漢字|假名} 標記注音：
     - 漢字模式 → <ruby>漢字<rt>假名</rt></ruby>
     - 純假名模式 → 假名
     - 朗讀 → 漢字（TTS 讀漢字比讀純假名自然）
   t: p=你會說的句子  c=店員/路人會對你說的話（只練聽）  w=單字
*/
window.JPDATA = {
  scenes: [
    { id: 'greet',   label: '基本・禮貌',   jp: 'あいさつ',       color: '#FF9500', line: '銀座線' },
    { id: 'shop',    label: '購物',         jp: 'かいもの',       color: '#F62E36', line: '丸ノ内線' },
    { id: 'clerk',   label: '店員會說的話', jp: 'てんいんのことば', color: '#0079C2', line: '三田線' },
    { id: 'food',    label: '餐廳點餐',     jp: 'レストラン',     color: '#C1A470', line: '有楽町線' },
    { id: 'conbini', label: '超商・藥妝',   jp: 'コンビニ',       color: '#00BB85', line: '千代田線' },
    { id: 'transit', label: '交通・問路',   jp: 'でんしゃ・みち', color: '#009BBF', line: '東西線' },
    { id: 'hotel',   label: '住宿',         jp: 'ホテル',         color: '#8F76D6', line: '半蔵門線' },
    { id: 'sight',   label: '觀光・拍照',   jp: 'かんこう',       color: '#00AC9B', line: '南北線' },
    { id: 'trouble', label: '出狀況・求助', jp: 'こまったとき',   color: '#B6007A', line: '大江戸線' },
    { id: 'number',  label: '數字・時間',   jp: 'すうじ・じかん', color: '#E85298', line: '浅草線' }
  ],

  items: [
    /* ───────── 基本・禮貌 ───────── */
    { i:'g01', s:'greet', t:'p', j:'すみません。', z:'不好意思', n:'叫店員、借過、小道歉都用這句，日本最萬用的一句話' },
    { i:'g02', s:'greet', t:'p', j:'ありがとうございます。', z:'謝謝' },
    { i:'g03', s:'greet', t:'p', j:'お{願|ねが}いします。', z:'麻煩你了', n:'指著東西加這句就能完成大部分交易' },
    { i:'g04', s:'greet', t:'p', j:'はい。', z:'是／好' },

<script>
(function(){
"use strict";
/* 會話資料（data.js）＋生活單字（vocab.js）合成一份題庫。
   兩邊欄位格式相同，所以直接接起來；分類選單再按群組分開顯示。*/
var D = window.JPDATA, VB = window.JPVOCAB || { scenes:[], items:[] };
var ITEMS = D.items.concat(VB.items), SCENES = D.scenes.concat(VB.scenes);

D.scenes.forEach(function(s){ TALK_IDS[s.id]=1; });
VB.scenes.forEach(function(s){ WORD_IDS[s.id]=1; });
var GROUPS = [
  { id:'talk', t:'會話句型', d:'去日本當場要講出來的句子', ids:TALK_IDS },
  { id:'word', t:'生活單字', d:'一千個日常名詞、動詞、形容詞', ids:WORD_IDS }
];
var SC = {}; SCENES.forEach(function(s){ SC[s.id] = s; });
var BY_ID = {}; ITEMS.forEach(function(x){ BY_ID[x.i] = x; });

/* ══════════ 工具 ══════════ */
var RUBY = /\{([^{}|]+)\|([^{}|]+)\}/g;
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function toKanji(j){ return String(j).replace(RUBY,'$1'); }
function toKana(j){ return String(j).replace(RUBY,'$2'); }
function toRuby(j){ return esc(j).replace(RUBY,function(m,k,r){
  return '<ruby>'+k+'<rt>'+r+'</rt></ruby>'; }); }
/* 朗讀用的文字。單字型條目要餵假名：裸漢字沒有上下文，語音引擎只能自己猜，
   「左」會被唸成音讀的「さ」、「十」會被唸成「じゅう」。
   句子則餵漢字，引擎才抓得到斷詞與語調。r 是手動指定的讀法，優先於上面兩者。 */
function sayOf(o){
  if(!o) return '';
  if(o.r) return o.r;
  if(o.t === 'w') return toKana(o.j);
  return toKanji(o.j);
}
/* 一定要標 lang="ja"。頁面本身是 lang="zh-Hant"，萬一 Google 字型沒載到（離線第一次開、
   或網路擋掉），系統字型會用中文字形去畫「直・曜・每・骨」這些中日寫法不同的字，
   學日文的人會被誤導。加上這個屬性，退而求其次時瀏覽器才會挑日文字形。*/
function jpHTML(j){
  return '<span lang="ja">' + (S.display==='kana' ? esc(toKana(j)) : toRuby(j)) + '</span>';
}
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var k=Math.floor(Math.random()*(i+1));
  var t=a[i]; a[i]=a[k]; a[k]=t; } return a; }
function el(id){ return document.getElementById(id); }
function sleep(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }

var SVG = {
  speaker:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>',
  small:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>',
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2"/><path d="M12 19v3"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
  replay:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.6-6.4"/><path d="M3 3v6h6"/></svg>'
};

/* ══════════ 設定與進度（localStorage best-effort） ══════════ */
var DEF = { display:'kanji', rate:0.8, voice:'', count:15, hands:false, model:true,
            pace:3.2, strict:false, dlgZh:false, voiceOK:0, pitch:1, roles:true,
            sfx:true, guide:true };
var S = {}, P = {}, ST = {};
function load(k,fb){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):fb; }catch(e){ return fb; } }
function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
(function(){ var s=load('jp_set',{})||{}; for(var k in DEF) S[k]=(k in s)?s[k]:DEF[k];
  P = load('jp_prog',{})||{};
  ST = load('jp_stats',null) || {days:{},streak:0,last:''};
  if(!ST.days) ST.days={}; })();
function saveSet(){ save('jp_set',S); }
function saveProg(){ save('jp_prog',P); }
function saveStats(){ save('jp_stats',ST); }

/* 熟練度 0–5：0 未學 ／ 1–2 學習中 ／ 3–4 已學會 ／ 5 已精通 */
var LVL = ['未學','學習中','學習中','已學會','已學會','已精通'];
var LVLC = ['var(--muted)','var(--warn)','var(--warn)','var(--accent)','var(--accent)','var(--ok)'];
function pips(n){
  var s='', i;
  for(i=1;i<=5;i++) s += '<i class="pip"'+(i<=n?' style="background:'+LVLC[n]+'"':'')+'></i>';
  return s;
}
function rec(id){ return P[id]||(P[id]={box:0,seen:0,wrong:0,right:0}); }
function boxOf(id){ var r=P[id]; return r?r.box:0; }
function dayKey(d){ d=d||new Date();
  return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function countDay(){
  var t=dayKey();
  if(ST.last!==t){
    var ys=dayKey(new Date(Date.now()-86400000));
    ST.streak = (ST.last===ys) ? (ST.streak||0)+1 : 1;
    ST.last=t;
  }
  ST.days[t]=(ST.days[t]||0)+1;
  saveStats();
}
/* 答錯只退一級，不歸零——一次失誤不該抹掉之前累積的進度 */
function mark(id,good){
  var r=rec(id), before=r.box;
  r.seen++;
  if(good){ r.right=(r.right||0)+1; r.box=Math.min(5,r.box+1); }
  else { r.wrong++; r.box=Math.max(0,r.box-1); }
  countDay(); saveProg();
  return { before:before, after:r.box, levelUp: (r.box>=3 && before<3) };
}
function tally(filter){
  var t={total:0,started:0,known:0,master:0};
  ITEMS.forEach(function(x){
    if(filter && !filter(x)) return;
    t.total++;
    var r=P[x.i], b=r?r.box:0;
    /* 碰過就算「學習中」。只看熟練度的話，答錯一次的句子會從進度條上消失，
       練了半天卻什麼都沒長，那正是最打擊信心的地方。 */
    if(r && r.seen) t.started++;
    if(b>=3) t.known++;
    if(b>=5) t.master++;
  });
  return t;
}
/* 進度條。三段由強到弱排：已精通（綠）→ 已學會（藍）→ 學習中（黃），
   這樣每升一級，顏色就往左邊推一點，看得出來是在往上爬。
   t.known 本來就含 t.master，所以藍色那段要扣掉精通的數量，不然會重複算。*/
/* 寬度 0 的區段乾脆不要畫，交界的那條白線才不會疊在一起 */
function segs(t, cls){
  var n = [['master',t.master],['known',t.known-t.master],['doing',t.started-t.known]], h='';
  n.forEach(function(x){
    if(x[1] > 0) h += '<i class="'+cls+' '+x[0]+'" style="width:'+(x[1]/t.total*100)+'%"></i>';
  });
  return h;
}
function progBar(t){
  if(!t.total) return '<div class="pbar"></div>';
  return '<div class="pbar">'+segs(t,'seg')+'</div>';
}
function progLegend(t){
  return '<div class="plegend">'+
    '<span><i class="dot master"></i>已精通 '+t.master+'</span>'+
    '<span><i class="dot known"></i>已學會 '+(t.known-t.master)+'</span>'+
    '<span><i class="dot doing"></i>學習中 '+(t.started-t.known)+'</span></div>';
}
/* 情境卡／分區標頭上的細進度條，同樣的三段配色 */
function miniBar(t, cls){
  if(!t.total) return '<span class="'+cls+'"></span>';
  return '<span class="'+cls+'">'+segs(t,'mseg')+'</span>';
}
function todayCount(){ return ST.days[dayKey()]||0; }
function dueList(){
  var a=[]; ITEMS.forEach(function(x){ var r=P[x.i];
    if(r && r.seen && r.box<3 && r.wrong>0) a.push(x); });
  a.sort(function(x,y){ return (P[x.i].box-P[y.i].box) || (P[y.i].wrong-P[x.i].wrong); });
  return a;
}
/* 驗收測驗：已學會但還沒精通的句子 */
function checkList(){
  var a=[]; ITEMS.forEach(function(x){ var b=boxOf(x.i); if(b>=3&&b<5) a.push(x); });
  return shuffle(a);
}
function poolOf(sel, mode){
  var pool = ITEMS.filter(function(x){ return sel[x.s]; });
  if(mode==='produce'||mode==='speak') pool = pool.filter(function(x){ return x.t!=='c'; });
  return pool;
}
/* 每一輪優先給沒學過的句子，混入少量複習，所以可以一直接著學下去 */
function buildBatch(sel, mode, n){
  var pool = poolOf(sel, mode), fresh=[], learning=[], ripe=[];
  pool.forEach(function(x){
    var r=P[x.i];
    if(!r || !r.seen) fresh.push(x);
    else if(r.box<3) learning.push(x);
    else if(r.box<5) ripe.push(x);
  });
  /* 複習先挑最接近「學會」的那幾句——把快到手的先收掉，進度才看得到動。
     反過來永遠先挑最弱的，會變成每句都卡在低級不上不下。 */
  learning.sort(function(a,b){ return boxOf(b.i)-boxOf(a.i); });
  ripe = shuffle(ripe);
  var want = (!n || n<1) ? pool.length : Math.min(n, pool.length);
  var out = fresh.slice(0, Math.max(1, Math.round(want*0.4)));
  out = out.concat(learning.slice(0, Math.max(0, Math.round(want*0.6))));
  out = out.concat(ripe.slice(0, Math.max(0, want-out.length)));
  if(out.length<want) out = out.concat(fresh.slice(out.length, want));
  if(out.length<want) out = out.concat(learning.slice(0, want-out.length));
  if(out.length<want) out = out.concat(shuffle(pool).slice(0, want-out.length));
  var seen={}, uniq=[];
  out.forEach(function(x){ if(!seen[x.i]){ seen[x.i]=1; uniq.push(x); } });
  return shuffle(uniq.slice(0, want));
}
function freshLeft(sel, mode){
  var n=0; poolOf(sel,mode).forEach(function(x){ var r=P[x.i]; if(!r||!r.seen) n++; });
  return n;
}

/* ══════════ 語音朗讀 ══════════ */
var synth = window.speechSynthesis, voicesJa = [], theVoice = null, altVoice = null, primed = false;
var TTS_OK = !!synth && typeof window.SpeechSynthesisUtterance === 'function';
/* 同一支手機上「網路語音」和「本機語音」差距非常大：本機是壓縮過的小模型，
   聽起來就是機器人；網路語音是神經模型，接近真人。排序時大幅優先網路語音。 */
function isNetVoice(v){
  var n=(v.name||'')+' '+(v.voiceURI||'');
  if(/-network\b|#network|network$/i.test(n)) return true;
  if(/-local\b|#local|local$|compact/i.test(n)) return false;
  return v.localService === false;
}
function rankVoice(v){
  var n=(v.name||'')+' '+(v.voiceURI||''), sc=0, i,
  good=[[/Nanami/i,100],[/Kyoko/i,97],[/O\s*-?\s*ren/i,92],[/Keita/i,90],[/Google[^|]*(日本語|Japanese)/i,88],
        [/Otoya/i,80],[/Hattori/i,78],[/Sayaka/i,76],[/Mizuki/i,74],[/Takumi/i,72],
        [/Ayumi/i,70],[/Haruka/i,70],[/Ichiro/i,66]];
  for(i=0;i<good.length;i++) if(good[i][0].test(n)) sc=Math.max(sc,good[i][1]);

/* 音效：即時合成，沒有音檔，離線一樣有聲音 */
function ac(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)();
  if(actx.state==='suspended') actx.resume(); return actx; }catch(e){ return null; } }
function tone(freq,at,dur,type,vol,cutoff){
  var c=ac(); if(!c) return;
  try{
    var t0=c.currentTime+at, o=c.createOscillator(), g=c.createGain(), tail=g;
    o.type=type||'triangle'; o.frequency.setValueAtTime(freq,t0);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||0.16,t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);
    if(cutoff){ var f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(cutoff,t0);
      g.connect(f); tail=f; }
    tail.connect(c.destination); o.start(t0); o.stop(t0+dur+0.03);
  }catch(e){}
}

/* ══════════════════════════════════════════════════════════════
   JLPT N5 題庫練習
   題型依官方「試験科目と問題の構成」：
     文字・語彙 20分 ／ 文法・讀解 40分 ／ 聽解 30分
   五種出題畫面：

     order  文の組み立て，選出★那一格是哪個零件
     read   先讀文章再作答，同一篇文章的題目會連著出
     listen 聽對話，兩個聲音輪流念，再回答
     react  発話表現／即時応答，看情境或聽一句話選回應
   ══════════════════════════════════════════════════════════════ */
var N5 = window.JPN5 || { sections:[], parts:[], items:[], passages:[] };
var N5P = {}; N5.parts.forEach(function(p){ N5P[p.id]=p; });
var N5S = {}; N5.sections.forEach(function(s){ N5S[s.id]=s; });
var N5X = {}; (N5.passages||[]).forEach(function(x){ N5X[x.id]=x; });

/* 組句題的正解＝照 ord 排好之後，★那一格放的是哪個零件 */
function n5Ans(o){
  return N5P[o.p].kind==='order' ? o.ord[o.star] : o.a;
}
function n5Items(filter){ return N5.items.filter(filter||function(){return true;}); }
function n5Tally(filter){
  var t={total:0,started:0,known:0,master:0};
  N5.items.forEach(function(x){
    if(filter && !filter(x)) return;
    t.total++;
    var r=P[x.i], b=r?r.box:0;
    if(r && r.seen) t.started++;
    if(b>=3) t.known++;
    if(b>=5) t.master++;
  });
  return t;
}
/* 題幹：【】是考卷上畫底線的地方，（　）是空格，＿＿／★ 是組句題的格子 */
function n5Stem(s){
  return esc(s)
    .replace(/【([^】]*)】/g, '<u class="n5u">$1</u>')
    .replace(/★/g, '<b class="n5star">★</b>');
}

function n5Say(o){

/* 出題順序：沒練過的排前面，但同一篇文章的題目一定要連在一起，
   不然讀解會變成每題都要重讀一次文章。*/
function n5Order(list){
  var solo=[], byPsg={}, order=[];
  list.forEach(function(o){
    if(o.g){ if(!byPsg[o.g]){ byPsg[o.g]=[]; order.push(o.g); } byPsg[o.g].push(o); }
    else solo.push(o);
  });
  var fresh = solo.filter(function(o){ return !(P[o.i]&&P[o.i].seen); });
  var seen  = solo.filter(function(o){ return  (P[o.i]&&P[o.i].seen); });
  seen.sort(function(a,b){ return (P[b.i].box||0)-(P[a.i].box||0); });
  var out = shuffle(fresh).concat(seen);
  /* 文章題整組插進來，保持組內原順序 */
  order.forEach(function(g){ out = out.concat(byPsg[g]); });
  return out;
}

/* ══════════ 出題畫面 ══════════ */
function n5Quiz(pool, title, color, ctx){
  var ix=0, right=0, wrong=[], run=0;
  ctx = ctx || {};
  var d = screen('');

  function render(){
    var o = pool[ix], part = N5P[o.p], kind = part.kind;
    var ans = n5Ans(o), picked = -1, done = false;

    var h = '<div class="n5bar"><span class="n5no">'+esc(part.no)+'</span>'+
      '<span class="n5t">'+esc(part.t)+'</span>'+
      '<span class="n5ix">'+(ix+1)+' / '+pool.length+'</span></div>'+
      '<div class="n5jd jp" lang="ja">'+esc(part.jd)+'</div>';

    /* ── 文章（読解） ── */
    if(kind==='read' && o.g && N5X[o.g]){
      var x = N5X[o.g];
      var first = (ix===0) || pool[ix-1].g !== o.g;
      h += '<div class="n5psg'+(x.k==='notice'?' notice':'')+(first?'':' seen')+'">'+
        '<div class="n5psgx jp" lang="ja">'+esc(x.x).replace(/\n/g,'<br>')+'</div>'+
        '<button class="n5zh" id="pz">看中文翻譯</button>'+
        '<div class="n5zhx zh" id="pzx" hidden>'+esc(x.z).replace(/\n/g,'<br>')+'</div></div>';
    }

    /* ── 聽解：播放鍵 ── */
    if(kind==='listen' || o.p==='c4'){
      h += '<div class="n5play"><button class="speaker" id="pl" aria-label="播放">'+SVG.speaker+'</button>'+
        '<div class="note zh" style="margin:0;padding:0;background:none;border:0">'+
          (kind==='listen' ? '聽完對話再作答。可以重聽。' : '聽一句話，選出適合的回答。')+'</div>'+
        '<button class="btn ghost sm" id="slow">放慢重聽</button>'+
        '<button class="n5zh" id="sc">看逐字稿</button>'+
        '<div class="n5zhx jp" lang="ja" id="scx" hidden>'+
          (kind==='listen'
            ? o.d.map(function(t){ return '<b>'+(t.w==='M'?'男':'女')+'：</b>'+toRuby(t.j); }).join('<br>')
                + '<br><b>Q：</b>'+toRuby(o.q)
            : toRuby(o.q))+
        '</div></div>';
    }
    /* ── 発話表現：文字情境 ── */
    if(o.p==='c3'){
      h += '<div class="n5sit"><div class="n5sitl">こんな とき、なんと いいますか。</div>'+
        '<div class="jp" lang="ja">'+toRuby(o.sit)+'</div>'+
        '<button class="replay" id="pl2" aria-label="念一次">'+SVG.speaker+'</button></div>';
    }

    /* ── 題幹 ── */
    if(o.s && kind!=='read') h += '<div class="n5q jp" lang="ja">'+n5Stem(o.s)+'</div>';
    if(kind==='read' && o.s) h += '<div class="n5q jp" lang="ja">'+n5Stem(o.s)+'</div>';

    /* ── 選項 ── */
    h += '<div class="opts n5opts">';
    o.o.forEach(function(x,k){
      h += '<button class="opt n5opt" data-k="'+k+'">'+
        '<span class="k">'+(k+1)+'</span>'+
        '<span class="txt jp" lang="ja">'+esc(x)+'</span></button>';
    });
    h += '</div><div id="fb"></div>';
    d.innerHTML = h;

    /* 文章翻譯 / 逐字稿的展開 */
    var pz=d.querySelector('#pz'), pzx=d.querySelector('#pzx');
    if(pz) pz.onclick=function(){ pzx.hidden=!pzx.hidden; pz.textContent=pzx.hidden?'看中文翻譯':'收起翻譯'; };
    var sc=d.querySelector('#sc'), scx=d.querySelector('#scx');
    if(sc) sc.onclick=function(){ scx.hidden=!scx.hidden; sc.textContent=scx.hidden?'看逐字稿':'收起逐字稿'; };

    /* 播放 */
    function playAll(rate){
      stopSpeak();
      if(kind==='listen'){
        var seq = o.d.map(function(t){ return { t:toKanji(t.j), opt:roleOpt(t.w==='M'?'me':'you') }; });
        seq.push({ t:toKanji(o.q), opt:{} });
        (function step(n){
          if(n>=seq.length) return;
          speak(seq[n].t, rate, seq[n].opt).then(function(){ setTimeout(function(){ step(n+1); }, 260); });
        })(0);
      } else {
        speak(toKanji(o.q||o.sit), rate);
      }
    }
    var pl=d.querySelector('#pl'); if(pl) pl.onclick=function(){ playAll(); };
    var pl2=d.querySelector('#pl2'); if(pl2) pl2.onclick=function(){ speak(toKanji(o.sit)); };
    var sl=d.querySelector('#slow'); if(sl) sl.onclick=function(){ playAll(0.72); };
    if(pl) setTimeout(function(){ playAll(); }, 320);

    /* 作答 */
    d.querySelectorAll('.n5opt').forEach(function(b){
      b.onclick = function(){
        if(done) return; done=true;
        picked = +b.dataset.k;
        var good = picked===ans;
        var res = mark(o.i, good);
        if(good){ right++; run++; } else { wrong.push(o); run=0; }
        good ? (run>=4 ? sfxStreak() : sfxGood()) : sfxBad();

        d.querySelectorAll('.n5opt').forEach(function(x,k){
          if(k===ans) x.classList.add('good');
          else if(k===picked) x.classList.add('bad');
          else x.classList.add('dim');
          x.disabled = true;
        });

        /* 解說 */
        var fh = '<div class="n5fb '+(good?'good':'bad')+'">'+
          guide(good ? (run>=4?'streak':'good') : 'bad','sm')+
          '<div><b>'+(good?'答對了':'答錯了')+'</b>';
        if(kind==='order'){
          /* 把正確的句子排出來給他看，★那一格標起來 */
          var built = o.ord.map(function(k,slot){
            return '<span class="n5seg'+(slot===o.star?' star':'')+'">'+esc(o.o[k])+'</span>';
          }).join('');
          var st2 = String(o.s), b0 = st2.search(/[＿★]/), b1 = st2.search(/[＿★](?![\s\S]*[＿★])/);
          fh += '<div class="n5built jp" lang="ja">'+esc(st2.slice(0,b0))+built+esc(st2.slice(b1+1))+'</div>';
        }
        if(o.r) fh += '<div class="n5ans jp" lang="ja">'+toRuby(o.r)+
          ' <button class="replay" id="sa" aria-label="念一次">'+SVG.speaker+'</button></div>';
        if(o.z) fh += '<div class="zh">'+esc(o.z)+'</div>';
        if(o.n) fh += '<div class="zh n5tip">'+esc(o.n)+'</div>';
        fh += '</div></div>';

        fh += '<div class="lvlup"><span class="muted">熟練度</span>'+
          '<span class="pips">'+pips(res.before)+'</span><span class="arrow">→</span>'+
          '<span class="pips">'+pips(res.after)+'</span>'+
          '<b style="color:'+LVLC[res.after]+'">'+LVL[res.after]+'</b></div>';
        fh += '<button class="btn primary" id="next">'+(ix+1<pool.length?'下一題':'看結果')+'</button>';
        d.querySelector('#fb').innerHTML = fh;

        var sa=d.querySelector('#sa'); if(sa) sa.onclick=function(){ n5Say(o); };
        if(!good && o.r) setTimeout(function(){ n5Say(o); }, 420);

        d.querySelector('#next').onclick=function(){
          ix++;
          if(ix<pool.length) render();
          else n5Result();
        };
        d.querySelector('#fb').scrollIntoView({behavior:'smooth', block:'nearest'});
      };
    });
  }

  function n5Result(){
    stopSpeak();
    var pct = Math.round(right/pool.length*100);
    var t = n5Tally(ctx.sid ? function(x){ return N5P[x.p].s===ctx.sid; } : null);
    var h = '<div class="card score">'+guide(pct>=80?'cele':(pct>=60?'good':'idle'),'lg')+
      '<div class="pct">'+pct+'%</div>'+
      '<div class="lbl">'+pool.length+' 題中答對 '+right+' 題</div></div>';

    h += '<div class="card progwrap"><div class="prow"><span class="plabel">累計進度</span>'+
      '<span class="pnum">'+t.known+' <span class="muted">/ '+t.total+' 題已學會</span></span></div>'+
      progBar(t)+progLegend(t)+'</div>';

    if(wrong.length){
      h += '<div class="eyebrow">這幾題再看一次</div>';
      wrong.forEach(function(o){
        var ans = n5Ans(o);
        h += '<div class="wrongrow"><div class="b">'+
          '<div class="j jp" lang="ja">'+(o.r?toRuby(o.r):n5Stem(o.s||o.q||o.sit))+'</div>'+
          '<div class="z zh">'+esc(o.z||'')+'　<b>正解：'+(ans+1)+'　'+esc(o.o[ans])+'</b></div>'+
          '</div></div>';
      });
    }
    h += '<div class="spacer"></div>';
    if(wrong.length) h += '<button class="btn" id="again">只重做錯的 '+wrong.length+' 題</button>';
    h += '<div class="row" style="margin-top:9px">'+
      '<button class="btn ghost" id="more">再來一輪</button>'+
      '<button class="btn ghost" id="bk">回上一頁</button></div>';
    d.innerHTML = h;

    var ag=d.querySelector('#again');
    if(ag) ag.onclick=function(){ prime();
      go(function(){ return n5Quiz(shuffle(wrong), title+'・錯題', color, ctx); }, title+'・錯題', color); };
    d.querySelector('#more').onclick=function(){ prime();
      var src = ctx.kind==='part'
        ? n5Items(function(x){ return x.p===ctx.p; })
        : n5Items(function(x){ return N5P[x.p].s===ctx.sid; });
      ix=0; right=0; wrong=[]; run=0; pool = n5Order(src); render();
    };
    d.querySelector('#bk').onclick=back;
  }

  render();
  return d;
}

/* ══════════════════════════════════════════════════════════════
   N5 模擬測驗
   和平常的練習刻意分開：練習沒有時間壓力、答完馬上看解說；
   模擬測驗是自己按下去才開始，照官方作答時間倒數，中途不給答案，
   全部交卷後才對照，並且用官方的基準分判定及格與否。

   官方判定（N5）：
     言語知識（文字・語彙・文法）・読解  0〜120，基準點 38
     聴解                              0〜60，基準點 19
     總分                              0〜180，及格 80
   任何一科低於基準點就不及格，就算總分有到。
   ══════════════════════════════════════════════════════════════ */
var N5MOCK = {
  /* 正式考試一回各大題的題數（官方題數每次略有出入，這是常見的配置） */
  n: { m1:7, m2:5, m3:6, m4:3, g1:9, g2:4, g3:4, g4:2, g5:2, g6:1, c1:7, c2:6, c3:5, c4:6 },
  pass: { total:80, know:38, cho:19 }
};
/* 把題庫抽成一份考卷。同一篇文章的讀解題要整組帶走，不然文章會缺題。*/
function n5MockPaper(){
  var paper = [];
  Object.keys(N5MOCK.n).forEach(function(pid){
    var want = N5MOCK.n[pid];
    var pool = N5.items.filter(function(x){ return x.p===pid; });
    if(N5P[pid].kind==='read'){
      /* 以文章為單位抽，抽到湊滿題數為止 */
      var groups = {}, order = [];
      pool.forEach(function(o){ if(!groups[o.g]){ groups[o.g]=[]; order.push(o.g); } groups[o.g].push(o); });
      shuffle(order).forEach(function(g){
        if(paper.filter(function(x){ return x.p===pid; }).length >= want) return;
        paper = paper.concat(groups[g]);
      });
    } else {
      paper = paper.concat(shuffle(pool).slice(0, want));
    }
  });
  return paper;
}
function n5Score(paper, ans){
  /* 官方是等化分數，這裡用「答對比例 × 該科滿分」做近似 */
  var know = { right:0, total:0 }, cho = { right:0, total:0 };
  paper.forEach(function(o,k){
    var box = N5P[o.p].s==='choka' ? cho : know;
    box.total++;
    if(ans[k]===n5Ans(o)) box.right++;
  });
  var kp = know.total ? know.right/know.total : 0;
  var cp = cho.total  ? cho.right /cho.total  : 0;
  var ks = Math.round(kp*120), cs = Math.round(cp*60);
  return {
    know:know, cho:cho, kScore:ks, cScore:cs, total:ks+cs,
    kPass: ks>=N5MOCK.pass.know, cPass: cs>=N5MOCK.pass.cho,
    pass: (ks+cs)>=N5MOCK.pass.total && ks>=N5MOCK.pass.know && cs>=N5MOCK.pass.cho
  };
}

/* ══════════ 模擬測驗的說明頁（按下去才開始） ══════════ */
function n5MockIntro(){

  var t = n5Tally();
  var done = t.started, pct = Math.round(done/t.total*100);

  var h = '<div class="card n5mhero">'+guide(pct>=60?'good':'idle','lg')+
    '<div class="n5mt">模擬測驗</div>'+
    '<div class="n5ms zh">'+totalQ+' 題・'+mins+' 分鐘・照正式考試的規則判定</div></div>';

  h += '<div class="card progwrap"><div class="prow"><span class="plabel">你的準備度</span>'+

       : '大部分的題目都還沒練過，現在考分數會偏低。建議先回去練習，覺得有把握了再來。')+
    '</div></div>';

  h += '<div class="eyebrow">規則</div>'+
    '<div class="card n5rules">'+
      '<div class="n5rule"><b>分三科考，各自計時</b>'+
        N5.sections.map(function(s){ return '<span>'+esc(s.label)+' '+s.min+' 分</span>'; }).join('')+'</div>'+
      '<div class="n5rule"><b>作答中不會告訴你對不對</b><span>全部交卷後才一起對答案看解說</span></div>'+
      '<div class="n5rule"><b>時間到自動交卷</b><span>沒作答的算錯，和正式考試一樣</span></div>'+
      '<div class="n5rule"><b>判定標準</b>'+
        '<span>總分 '+N5MOCK.pass.total+' / 180 以上</span>'+
        '<span>而且 言語知識・讀解 ≥ '+N5MOCK.pass.know+' / 120</span>'+
        '<span>而且 聽解 ≥ '+N5MOCK.pass.cho+' / 60</span>'+
        '<span class="n5warn">任何一科沒到基準分，總分再高也不及格</span></div>'+
    '</div>';

  h += '<div class="note zh">模擬測驗的結果<b>不會</b>影響平常練習的熟練度，放心考。</div>';
  h += '<div class="spacer"></div>'+
    '<button class="btn primary" id="go">開始模擬測驗</button>'+
    '<div class="row" style="margin-top:9px"><button class="btn ghost" id="bk">還沒準備好，回去練習</button></div>';

  var d = screen(h);
  d.querySelector('#go').onclick=function(){ prime();
    var paper = n5MockPaper();

  };
  d.querySelector('#bk').onclick=back;

/* ══════════ 考試進行中 ══════════ */
function n5MockRun(paper){
  var d = screen('');
  var ans = {}, ix = 0;
  /* 依科目切段，每段各自倒數 */
  var segs = N5.sections.map(function(s){
    return { s:s, from:-1, to:-1 };
  });
  paper.forEach(function(o,k){
    var sid = N5P[o.p].s, g = segs.filter(function(x){ return x.s.id===sid; })[0];
    if(g.from<0) g.from=k;
    g.to = k;
  });
  segs = segs.filter(function(g){ return g.from>=0; });
  var segIx = 0, left = 0, timer = null;

  function segOf(k){
    for(var i=0;i<segs.length;i++) if(k>=segs[i].from && k<=segs[i].to) return i;
    return segs.length-1;
  }
  function startSeg(i){
    segIx = i; left = segs[i].s.min*60;
    clearInterval(timer);
    timer = setInterval(function(){
      left--;
      var el = d.querySelector('#clk');
      if(el){ el.textContent = fmt(left); el.className = 'n5clk'+(left<=60?' low':''); }
      if(left<=0){ clearInterval(timer); jumpTo(segs[segIx].to+1); }
    }, 1000);
  }
  function fmt(s){ s=Math.max(0,s); return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2); }
  function jumpTo(k){
    if(k>=paper.length){ clearInterval(timer); return finish(); }
    var ns = segOf(k);
    ix = k;
    if(ns!==segIx){ startSeg(ns); segBreak(ns); } else render();
  }
  /* 換科目之間插一張休息頁，和正式考試一樣分科進行 */
  function segBreak(i){
    clearInterval(timer);
    var s = segs[i].s, n = segs[i].to-segs[i].from+1;
    d.innerHTML = '<div class="card n5mhero">'+guide('idle','md')+
      '<div class="n5mt">'+esc(s.label)+'</div>'+
      '<div class="n5ms zh">'+n+' 題・'+s.min+' 分鐘</div></div>'+
      '<div class="note zh">按下去才開始計時。</div>'+
      '<div class="spacer"></div><button class="btn primary" id="st">開始這一科</button>';
    d.querySelector('#st').onclick=function(){ prime(); startSeg(i); render(); };
  }

  function render(){
    var o = paper[ix], part = N5P[o.p], kind = part.kind;
    var sec = N5S[part.s];
    var h = '<div class="n5mbar"><span class="n5msec">'+esc(sec.label)+'</span>'+
      '<span class="n5clk" id="clk">'+fmt(left)+'</span></div>'+
      '<div class="n5bar"><span class="n5no">'+esc(part.no)+'</span>'+
      '<span class="n5t">'+esc(part.t)+'</span>'+
      '<span class="n5ix">'+(ix+1)+' / '+paper.length+'</span></div>';

    if(kind==='read' && o.g && N5X[o.g]){
      var x = N5X[o.g];
      h += '<div class="n5psg'+(x.k==='notice'?' notice':'')+'">'+
        '<div class="n5psgx jp" lang="ja">'+esc(x.x).replace(/\n/g,'<br>')+'</div></div>';
    }
    if(kind==='listen' || o.p==='c4'){
      h += '<div class="n5play"><button class="speaker" id="pl" aria-label="播放">'+SVG.speaker+'</button>'+
        '<div class="note zh" style="margin:0;padding:0;background:none;border:0">'+
          '正式考試每題只播一次。這裡可以重播，但建議只聽一次。</div></div>';
    }
    if(o.p==='c3'){
      h += '<div class="n5sit"><div class="n5sitl">こんな とき、なんと いいますか。</div>'+
        '<div class="jp" lang="ja">'+toRuby(o.sit)+'</div></div>';
    }
    if(o.s) h += '<div class="n5q jp" lang="ja">'+n5Stem(o.s)+'</div>';

    h += '<div class="opts n5opts">';
    o.o.forEach(function(x,k){
      h += '<button class="opt n5opt'+(ans[ix]===k?' sel':'')+'" data-k="'+k+'">'+
        '<span class="k">'+(k+1)+'</span><span class="txt jp" lang="ja">'+esc(x)+'</span></button>';
    });
    h += '</div>';
    h += '<div class="row" style="margin-top:12px">'+
      (ix>segs[segIx].from ? '<button class="btn ghost" id="prev">上一題</button>' : '')+
      '<button class="btn primary" id="next">'+
        (ix===segs[segIx].to ? (segIx===segs.length-1?'交卷':'下一科') : '下一題')+'</button></div>';
    d.innerHTML = h;

    function playAll(){
      stopSpeak();
      if(kind==='listen'){
        var seq = o.d.map(function(t){ return { t:toKanji(t.j), opt:roleOpt(t.w==='M'?'me':'you') }; });
        seq.push({ t:toKanji(o.q), opt:{} });
        (function step(n){ if(n>=seq.length) return;
          speak(seq[n].t, null, seq[n].opt).then(function(){ setTimeout(function(){ step(n+1); }, 260); }); })(0);
      } else speak(toKanji(o.q||o.sit));
    }
    var pl=d.querySelector('#pl');
    if(pl){ pl.onclick=playAll; setTimeout(playAll, 320); }

    d.querySelectorAll('.n5opt').forEach(function(b){
      b.onclick=function(){
        ans[ix] = +b.dataset.k;
        d.querySelectorAll('.n5opt').forEach(function(x){ x.classList.remove('sel'); });
        b.classList.add('sel');
      };
    });
    var pv=d.querySelector('#prev'); if(pv) pv.onclick=function(){ ix--; render(); };
    d.querySelector('#next').onclick=function(){ stopSpeak(); jumpTo(ix+1); };
  }

  function finish(){
    stopSpeak(); clearInterval(timer);
    var r = n5Score(paper, ans);
    replace(function(){ return n5MockResult(paper, ans, r); }, '模擬測驗結果', '#B8860B');
  }

  segBreak(0);
  return d;
}

/* ══════════ 成績單 ══════════ */
function n5MockResult(paper, ans, r){
  var h = '<div class="card n5mhero '+(r.pass?'ok':'no')+'">'+guide(r.pass?'cele':'idle','lg')+
    '<div class="n5verd">'+(r.pass?'及格':'不及格')+'</div>'+
    '<div class="n5total">'+r.total+' <span>/ 180</span></div>'+
    '<div class="n5ms zh">及格線 '+N5MOCK.pass.total+' 分</div></div>';

  function bar(label, score, max, base, ok, right, total){
    return '<div class="n5sc'+(ok?'':' ng')+'">'+
      '<div class="n5sch"><b>'+esc(label)+'</b>'+
        '<span>'+score+' / '+max+'　<em>'+(ok?'通過':'未達基準')+'</em></span></div>'+
      '<div class="n5scb"><i style="width:'+(score/max*100)+'%"></i>'+
        '<u style="left:'+(base/max*100)+'%"></u></div>'+
      '<div class="n5scn">答對 '+right+' / '+total+' 題　·　基準分 '+base+'</div></div>';
  }
  h += '<div class="card">'+
    bar('言語知識・讀解', r.kScore, 120, N5MOCK.pass.know, r.kPass, r.know.right, r.know.total)+
    bar('聽解', r.cScore, 60, N5MOCK.pass.cho, r.cPass, r.cho.right, r.cho.total)+
    '</div>';

  if(!r.pass){
    var why = [];
    if(!r.kPass) why.push('言語知識・讀解沒到 '+N5MOCK.pass.know+' 分');
    if(!r.cPass) why.push('聽解沒到 '+N5MOCK.pass.cho+' 分');
    if(r.total<N5MOCK.pass.total) why.push('總分沒到 '+N5MOCK.pass.total+' 分');
    h += '<div class="banner"><span class="ic">！</span><div>差在：'+why.join('、')+'。'+
      (r.kPass&&r.cPass ? '兩科都過了基準分，只差總分，再穩一點就過了。' : '')+'</div></div>';
  }

  /* 哪個大題最弱 */
  var byPart = {};
  paper.forEach(function(o,k){
    var p = byPart[o.p] || (byPart[o.p]={right:0,total:0});
    p.total++; if(ans[k]===n5Ans(o)) p.right++;
  });
  var weak = Object.keys(byPart).map(function(pid){
    return { pid:pid, r:byPart[pid].right/byPart[pid].total, d:byPart[pid] };
  }).sort(function(a,b){ return a.r-b.r; });
  h += '<div class="eyebrow">各大題表現</div><div class="card n5parts">';
  weak.forEach(function(w){
    var p = N5P[w.pid];
    h += '<div class="n5prow"><span class="n5no">'+esc(p.no)+'</span>'+
      '<span class="n5pt">'+esc(p.t)+'</span>'+
      '<span class="n5pbar"><i style="width:'+(w.r*100)+'%;background:'+
        (w.r>=0.7?'var(--ok)':w.r>=0.4?'var(--warn)':'var(--bad)')+'"></i></span>'+
      '<span class="n5pn">'+w.d.right+'/'+w.d.total+'</span></div>';
  });
  h += '</div>';
