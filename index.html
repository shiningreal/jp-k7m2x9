<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B6FA4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="日文會話">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif;background:#fafaf9}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>日本旅行會話練習</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 版面概念：日本車站告示板 —— 左側線路色條、資訊分層、大字可遠讀；下方為拇指操作區 */
:root{
  --bg:#EEF1F4;            /* 偏藍的紙灰，不用純白 */
  --surface:#FFFFFF;
  --surface-2:#F6F8FA;
  --fg:#101720;
  --muted:#5C6773;
  --line:#D9E0E7;
  --accent:#0B6FA4;        /* 站名牌藍 */
  --accent-ink:#FFFFFF;
  --ok:#1C8A57;
  --bad:#C4122F;           /* 朱 */
  --warn:#9A6B00;
  --scene:#0B6FA4;
  --shadow:0 1px 2px rgba(16,23,32,.06), 0 6px 20px rgba(16,23,32,.07);
  --r:14px;
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --zh:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",sans-serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1118;
    --surface:#151C25;
    --surface-2:#1C242F;
    --fg:#E9EEF4;
    --muted:#95A3B3;
    --line:#28323F;
    --accent:#52B2DE;
    --accent-ink:#06121B;
    --ok:#44C286;
    --bad:#FF7A86;
    --warn:#E0B458;
    --scene:#52B2DE;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1118; --surface:#151C25; --surface-2:#1C242F; --fg:#E9EEF4; --muted:#95A3B3;
  --line:#28323F; --accent:#52B2DE; --accent-ink:#06121B; --ok:#44C286; --bad:#FF7A86;
  --warn:#E0B458; --scene:#52B2DE;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);
  -webkit-text-size-adjust:100%;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto;
  background:var(--bg);position:relative}

/* ── 頂部列 ── */
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
  background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar .rail{width:5px;height:24px;border-radius:3px;background:var(--scene);flex:none}
.bar-title{display:flex;align-items:center;gap:9px;flex:1;min-width:0;
  font-weight:700;font-size:16px;letter-spacing:.01em}
.bar-title span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{background:none;border:1px solid var(--line);border-radius:10px;width:38px;height:38px;
  display:grid;place-items:center;flex:none;color:var(--muted);padding:0}
.iconbtn:hover{color:var(--fg);border-color:var(--muted)}
.iconbtn svg{width:19px;height:19px;display:block}

main{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.screen{display:flex;flex-direction:column;gap:14px;padding:18px 16px;
  padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));min-height:100%}

/* ── 共用 ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.jp{font-family:var(--jp);font-feature-settings:"palt" 1}
.zh{font-family:var(--zh)}
h1{font-size:21px;margin:0;font-weight:700;letter-spacing:.01em;text-wrap:balance}
h2{font-size:15px;margin:0;font-weight:700}
ruby rt{font-size:.48em;font-weight:400;opacity:.78;letter-spacing:0}

.btn{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:15px 16px;box-shadow:var(--shadow);transition:transform .08s,border-color .15s}
.btn:active{transform:scale(.985)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;
  text-align:center;font-weight:700;font-size:16px}
.btn.ghost{background:var(--surface-2);box-shadow:none;text-align:center;font-weight:600}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}

/* ── 首頁 ── */
.hero{display:flex;flex-direction:column;gap:5px}
.hero .t{font-family:var(--jp);font-size:27px;font-weight:700;letter-spacing:.02em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stat{background:var(--surface);padding:12px 10px;text-align:center}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.25}
.stat span{font-size:11px;color:var(--muted)}
.progwrap{padding:15px 16px;display:flex;flex-direction:column;gap:10px}
.prow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.plabel{font-size:12px;letter-spacing:.1em;color:var(--muted);font-weight:700}
.pnum{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.pbar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--line)}
.pbar .seg{display:block;height:100%;transition:width .4s}
.seg.known{background:var(--accent)} .seg.doing{background:var(--warn)}
.plegend{display:flex;flex-wrap:wrap;gap:14px;font-size:11.5px;color:var(--muted);
  font-variant-numeric:tabular-nums}
.plegend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.known{background:var(--accent)} .dot.doing{background:var(--warn)} .dot.master{background:var(--ok)}
.badge{display:inline-block;margin-left:7px;min-width:20px;padding:1px 6px;border-radius:9px;
  background:var(--warn);color:#fff;font-size:11px;font-weight:700;vertical-align:1px;
  font-variant-numeric:tabular-nums}
.modes{display:flex;flex-direction:column;gap:9px}
.mode{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:14px 15px;box-shadow:var(--shadow)}
.mode .n{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  font-family:var(--jp);font-size:15px;font-weight:700;background:var(--surface-2);color:var(--mc,var(--accent));
  border:1px solid var(--line)}
.mode .b{flex:1;min-width:0}
.mode .b strong{display:block;font-size:15.5px;font-weight:700}
.mode .b em{display:block;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:2px}
.mode .chev{flex:none;color:var(--muted)}

/* ── 情境選單 ── */
.scenes{display:flex;flex-direction:column;gap:8px}
.scene{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.scene .bar2{width:5px;align-self:stretch;min-height:34px;border-radius:3px;background:var(--sc)}
.scene .b{flex:1;min-width:0}
.scene .b strong{display:block;font-size:15px}
.scene .b em{display:block;font-style:normal;font-family:var(--zh);font-size:11.5px;color:var(--muted);
  margin-top:2px;font-variant-numeric:tabular-nums}
.smini{display:block;height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:6px;max-width:190px}
.smini i{display:block;height:100%;background:var(--sc);border-radius:2px;transition:width .4s}
.scene .cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.scene[aria-pressed="true"]{border-color:var(--sc);background:var(--surface-2)}
.scene .tick{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.scene[aria-pressed="true"] .tick{background:var(--sc);border-color:var(--sc)}
.scene[aria-pressed="true"] .tick::after{content:"";width:6px;height:10px;border:2px solid #fff;
  border-top:0;border-left:0;transform:rotate(42deg) translate(-1px,-1px)}

/* ── 練習 ── */
.prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);
  font-variant-numeric:tabular-nums}
.prog .track{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.prog .fill{height:100%;background:var(--scene);transition:width .25s}
.prog .lvl{font-weight:700;font-size:11.5px;white-space:nowrap}
.row2{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.lvlup{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:10px;padding:10px 13px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:10px;font-size:12.5px}
.lvlup b{font-size:13px}
.pips{display:inline-flex;gap:3px}
.pip{width:7px;height:7px;border-radius:50%;background:var(--line);display:block}
.arrow{color:var(--muted)}

.stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:22px 18px;display:flex;flex-direction:column;
  align-items:center;gap:14px;text-align:center;border-top:4px solid var(--scene)}
.stage .ask{font-size:13px;color:var(--muted);letter-spacing:.02em}
.stage .big-jp{font-family:var(--jp);font-size:clamp(23px,6.4vw,31px);font-weight:700;
  line-height:2.0;letter-spacing:.015em;text-wrap:balance}
.stage .big-zh{font-family:var(--zh);font-size:clamp(20px,5.4vw,25px);font-weight:600;
  line-height:1.6;text-wrap:balance}
.stage .sub-zh{font-family:var(--zh);font-size:15px;color:var(--muted)}
.stage .sub-jp{font-family:var(--jp);font-size:16px;color:var(--muted);line-height:1.9}

.speaker{width:88px;height:88px;border-radius:50%;border:2px solid var(--scene);
  background:var(--surface-2);display:grid;place-items:center;color:var(--scene);margin:2px 0}
.speaker svg{width:34px;height:34px}
.speaker.playing{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(11,111,164,.0)}50%{box-shadow:0 0 0 12px rgba(11,111,164,.12)}}
.replay{display:inline-flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:999px;padding:8px 15px;font-size:13.5px;font-weight:600;color:var(--muted);width:auto}
.replay svg{width:16px;height:16px}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);
  border:1.5px solid var(--line);border-radius:12px;padding:14px 15px;box-shadow:var(--shadow);
  min-height:58px;transition:transform .08s,border-color .15s,background .15s}
.opt:active{transform:scale(.985)}
.opt .k{flex:none;width:25px;height:25px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.opt .txt{flex:1;min-width:0;font-size:16.5px;line-height:1.75}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 11%,var(--surface))}
.opt.good .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.opt.bad .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.dim{opacity:.45}

.note{border-left:3px solid var(--scene);background:var(--surface-2);border-radius:0 10px 10px 0;
  padding:11px 14px;font-size:13.5px;line-height:1.65;font-family:var(--zh);color:var(--muted)}
.note b{color:var(--fg)}
.verdict{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.verdict .mk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-size:14px;color:#fff;flex:none}
.verdict.ok .mk{background:var(--ok)} .verdict.ok{color:var(--ok)}
.verdict.no .mk{background:var(--bad)} .verdict.no{color:var(--bad)}
.verdict.mid .mk{background:var(--warn)} .verdict.mid{color:var(--warn)}

/* ── 口說 ── */
.mic{width:110px;height:110px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;box-shadow:var(--shadow);margin:4px 0}
.mic svg{width:42px;height:42px}
.mic.live{background:var(--bad);animation:live 1.2s ease-in-out infinite}
@keyframes live{0%,100%{box-shadow:0 0 0 0 rgba(196,18,47,.35)}50%{box-shadow:0 0 0 18px rgba(196,18,47,0)}}
.heard{font-family:var(--jp);font-size:19px;line-height:1.85;min-height:30px;word-break:break-all}
.heard .x{color:var(--bad);text-decoration:underline wavy var(--bad);text-underline-offset:4px}
.heard .ok{color:var(--fg)}
.meter{width:100%;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;transition:width .3s}

/* ── 對話 ── */
.chat{display:flex;flex-direction:column;gap:11px}
.bub{max-width:88%;padding:12px 15px;border-radius:15px;box-shadow:var(--shadow);line-height:1.8}
.bub .j{font-family:var(--jp);font-size:17.5px;line-height:2.0}
.bub .z{font-family:var(--zh);font-size:13px;color:var(--muted);margin-top:4px}
.bub.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:5px}
.bub.me .z{color:var(--accent-ink);opacity:.8}
.bub.me.wrong{background:var(--bad)}
.bact{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
.bub .spk{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;
  padding:5px 11px;color:var(--muted);display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600}
.bub.me .spk{background:rgba(255,255,255,.18);border-color:transparent;color:var(--accent-ink)}
.bub .spk svg{width:13px;height:13px}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 9px;flex-wrap:wrap}
.hintbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;
  padding:7px 14px;font-size:12px;font-weight:600;color:var(--muted);flex:none}
.hintbtn:hover{color:var(--fg);border-color:var(--muted)}
.ozh{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.scenesetup{font-family:var(--zh);font-size:13.5px;color:var(--muted);text-align:center;
  padding:9px 12px;background:var(--surface-2);border-radius:10px;line-height:1.6}

/* ── 設定抽屜 ── */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(8,13,19,.5);backdrop-filter:blur(2px)}
.sheet .panel{background:var(--surface);width:100%;max-width:720px;max-height:88%;overflow-y:auto;
  border-radius:18px 18px 0 0;padding:18px 16px;
  padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.grab{width:38px;height:4px;background:var(--line);border-radius:2px;align-self:center}
.set{display:flex;flex-direction:column;gap:8px}
.set>label{font-size:13px;font-weight:700}
.set .hint{font-size:12px;color:var(--muted);line-height:1.6;font-family:var(--zh)}
.seg{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:11px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:0}
.sw .l{flex:1;min-width:0}
.sw .l strong{display:block;font-size:14px}
.sw .l em{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px;font-family:var(--zh);line-height:1.5}
.toggle{flex:none;width:50px;height:30px;border-radius:15px;background:var(--line);border:0;position:relative;transition:background .18s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle[aria-pressed="true"]{background:var(--ok)}
.toggle[aria-pressed="true"]::after{transform:translateX(20px)}
.voicelist{display:flex;flex-direction:column;gap:7px;max-height:230px;overflow-y:auto}
.vrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--surface-2)}
.vrow.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.vrow .vn{flex:1;min-width:0;font-size:13px;overflow:hidden}
.vrow .vn>span.vq{display:block}
.vq{font-size:10.5px;font-weight:700;color:var(--muted);margin-top:2px;letter-spacing:.02em}
.vq.net{color:var(--ok)}
.wiz{display:flex;flex-direction:column;gap:11px;padding:14px;border:1px solid var(--accent);
  border-radius:12px;background:var(--surface-2)}
.wtop{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}
.wtop .vq{margin:0}
.wsample{font-family:var(--jp);font-size:21px;line-height:2;text-align:center}
.wask{font-family:var(--zh);font-size:13px;color:var(--muted);text-align:center}
.vrow .tag{font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:5px;
  background:var(--ok);color:#fff;flex:none}
.vrow button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;
  padding:6px 11px;font-size:12px;font-weight:600}

.banner{display:flex;gap:10px;padding:12px 14px;border-radius:11px;font-size:13px;line-height:1.65;
  font-family:var(--zh);background:color-mix(in srgb,var(--warn) 13%,var(--surface));
  border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));color:var(--fg)}
.banner.good{background:color-mix(in srgb,var(--ok) 11%,var(--surface));
  border-color:color-mix(in srgb,var(--ok) 32%,var(--line))}
.banner .ic{flex:none;font-weight:700;color:var(--warn)}
.banner.good .ic{color:var(--ok)}

/* ── 結果 ── */
.score{text-align:center;padding:26px 18px}
.score .pct{font-size:52px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;color:var(--scene)}
.score .lbl{font-size:13px;color:var(--muted);margin-top:7px}
.wronglist{display:flex;flex-direction:column;gap:8px}
.wrongrow{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);
  border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow)}
.wrongrow .b{flex:1;min-width:0}
.wrongrow .j{font-family:var(--jp);font-size:16px;line-height:1.9}

  var extra = {'要りません':'いりません','入りません':'いりません','下さい':'ください',
    '御願い':'おねがい','有難う':'ありがとう','出来ます':'できます','出来ますか':'できますか',
    '貰え':'もらえ','居ます':'います','良い':'いい','一寸':'ちょっと','判りません':'わかりません',
    '分かりません':'わかりません','宜しく':'よろしく','無い':'ない','有ります':'あります',
    '丁度':'ちょうど','此れ':'これ','其れ':'それ','大丈夫':'だいじょうぶ'};

function deKanji(s){
  var out = String(s||'');
  for(var i=0;i<K2K.length;i++){
    if(out.indexOf(K2K[i][0])>=0) out = out.split(K2K[i][0]).join(K2K[i][1]);
  }

}
function grade(heardList, item){
  var tKanji = norm(toKanji(item.j)), tKana = norm(toKana(item.j));
  var best=0, bestHeard=heardList[0]||'', bestPair=[norm(heardList[0]||''), tKanji];
  for(var i=0;i<heardList.length;i++){
    var raw = heardList[i];
    var cands = [norm(raw), norm(deKanji(raw))];
    for(var c=0;c<cands.length;c++){
      var tg = [tKanji, tKana];
      for(var k=0;k<tg.length;k++){
        var s = simil(cands[c], tg[k]);

      }
    }

var recog = null, recLive = false, recTimer = null;
function stopRec(){ if(recTimer){ clearTimeout(recTimer); recTimer=null; }
  if(recog){ try{ recog.stop(); }catch(e){} } }
function listen(onInterim){
  return new Promise(function(res){
    if(!ASR_PRESENT){ res({err:'unsupported'}); return; }
    var got=[], settled=false, errCode='';
    var r;
    try{ r = new SR(); }catch(e){ res({err:'unsupported'}); return; }
    recog = r;
    r.lang='ja-JP'; r.interimResults=true; r.continuous=false;
    try{ r.maxAlternatives=5; }catch(e){}
    r.onresult=function(ev){
      for(var i=ev.resultIndex;i<ev.results.length;i++){
        var rr=ev.results[i];
        if(rr.isFinal){ for(var k=0;k<rr.length;k++) if(rr[k]&&rr[k].transcript) got.push(rr[k].transcript); }
        else if(onInterim && rr[0]) onInterim(rr[0].transcript);
      }
    };
    r.onerror=function(ev){ errCode = (ev&&ev.error)||'error';
      if(errCode==='not-allowed'||errCode==='service-not-allowed'){ asrBlocked=true; asrReason=errCode; } };
    r.onend=function(){ if(settled) return; settled=true; recLive=false;
      if(recTimer){ clearTimeout(recTimer); recTimer=null; }
      res(got.length ? {list:got} : {err: errCode||'no-speech'}); };
    try{ r.start(); recLive=true; }
    catch(e){ settled=true; recLive=false; res({err:'start-failed'}); return; }
    recTimer = setTimeout(function(){ try{ r.stop(); }catch(e){} }, 7000);
  });
}

    try{ navigator.wakeLock.request('screen').then(function(s){ wl=s;

      '<div class="stage"><div class="ask" id="ask">看著中文，用日文念出來</div>'+
      '<div class="big-zh zh">'+esc(item.z)+'</div>'+
      '<div id="jp" '+(S.model?'':'hidden')+'><div class="sub-jp jp">'+jpHTML(item.j)+'</div></div>'+
      '<button class="mic" id="mic" aria-label="開始錄音">'+SVG.mic+'</button>'+
      '<div class="heard" id="heard"></div>'+
      '<div class="meter"><i id="meter" style="width:0"></i></div>'+
      '<button class="replay" id="model">'+SVG.small+' 聽範讀</button></div>'+
      '<div id="after"></div><div class="spacer"></div>'+
      '<div class="row"><button class="btn ghost" id="skip">跳過</button>'+
      '<button class="btn ghost" id="toggleJp">'+(S.model?'蓋住日文':'顯示日文')+'</button></div>';
    var d = screen(h);
    var mic=d.querySelector('#mic'), heard=d.querySelector('#heard'),
        meter=d.querySelector('#meter'), after=d.querySelector('#after'), ask=d.querySelector('#ask');

    function nextQ(){
      ix++;
      if(ix>=pool.length){ wake(false); showSpeakResult(great,pool.length,results,color,gained,ctx); }
      else replace(render,'口說練習',color);
    }
    function finish(res){
      var g = res.list ? grade(res.list, item) : null;
      mic.classList.remove('live');
      if(!g){
        var msg = ASR_ERR[res.err] || '沒有辨識到內容，再試一次。';
        heard.innerHTML = '';
        after.innerHTML = '<div class="banner"><span class="ic">！</span><div>'+esc(msg)+'</div></div>'+
          '<div class="row" style="margin-top:12px">'+
          '<button class="btn ghost" id="retry">再念一次</button>'+
          '<button class="btn primary" id="self">我念對了</button></div>';
        after.querySelector('#retry').onclick=function(){ after.innerHTML=''; run(); };
        after.querySelector('#self').onclick=function(){ if(mark(item.i,true).levelUp) gained++; great++;
          results.push({item:item,score:1,self:true}); nextQ(); };
        return;
      }
      var lvl=g.level, pct=Math.round(g.score*100);
      heard.innerHTML = lcsMark(g.cmp[0], g.cmp[1]);
      meter.style.width = pct+'%';
      meter.style.background = lvl==='great'?'var(--ok)':(lvl==='close'?'var(--warn)':'var(--bad)');
      var okNow = lvl==='great';
      if(mark(item.i, okNow).levelUp) gained++;
      if(okNow) great++;
      results.push({item:item,score:g.score,heard:g.heard});
      var vt = lvl==='great' ? ['ok','✓','完全正確']
             : lvl==='close' ? ['mid','～','快到了，有幾個字不一樣']
             : ['no','✕','差比較多，再念一次試試'];
      var ah = '<div class="verdict '+vt[0]+'"><span class="mk">'+vt[1]+'</span>'+vt[2]+
               ' <span class="muted" style="font-weight:400;font-size:13px">'+pct+'%</span></div>'+
               '<div class="note zh">辨識到：<b class="jp">'+esc(g.heard)+'</b><br>正確說法：<b class="jp">'+esc(toKanji(item.j))+'</b></div>';
      if(item.n) ah += '<div class="note zh" style="margin-top:8px"><b>用法：</b>'+esc(item.n)+'</div>';
      ah += '<div class="row" style="margin-top:12px">'+
            '<button class="btn ghost" id="again">再念一次</button>'+
            '<button class="btn primary" id="next">'+(ix+1>=pool.length?'看結果':'下一句')+'</button></div>';
      after.innerHTML = ah;
      after.querySelector('#again').onclick=function(){ after.innerHTML=''; heard.innerHTML='';
        meter.style.width='0'; run(); };
      after.querySelector('#next').onclick=nextQ;
      setTimeout(function(){ after.scrollIntoView({block:'nearest',behavior:'smooth'}); },60);
      if(S.hands && !stopped){ setTimeout(function(){ if(!stopped) nextQ(); }, lvl==='great'?1600:2800); }
    }
    async function run(){
      if(stopped) return;
      after.innerHTML=''; heard.innerHTML=''; meter.style.width='0';
      if(S.model){ ask.textContent='先聽一次範讀'; await speak(toKanji(item.j)); }
      if(stopped) return;
      ask.textContent='嗶一聲之後請念出來';
      beep(880,150); await sleep(330);
      if(stopped) return;
      mic.classList.add('live'); ask.textContent='請念⋯⋯';
      var res = await listen(function(t){ heard.textContent = t; });
      ask.textContent='看著中文，用日文念出來';
      finish(res);
    }
    mic.onclick=function(){ prime(); if(recLive){ stopRec(); } else { run(); } };
    d.querySelector('#model').onclick=function(){ prime(); speak(toKanji(item.j)); };
    d.querySelector('#skip').onclick=nextQ;
    d.querySelector('#toggleJp').onclick=function(){
      S.model=!S.model; saveSet(); replace(render,'口說練習',color); };
    if(S.hands){ wake(true); setTimeout(function(){ prime(); run(); }, 420); }
    autoStop = function(){ stopped=true; stopRec(); };
    return d;
  }
  if(!ASR_PRESENT){
    go(function(){
      var d = screen('<div class="banner"><span class="ic">！</span><div>'+
        '這個瀏覽器／環境沒有語音辨識。你還是可以用「自評」的方式練：聽範讀 → 自己念 → 自己判斷。'+
        '<br><br>想用自動辨識的話，請在 <b>Android Chrome</b> 或 <b>iPhone Safari</b> 開啟，'+
        '而且網址必須是 <b>https</b> 或 <b>localhost</b>。</div></div>'+
        '<button class="btn primary" id="go">用自評模式開始</button>');
      d.querySelector('#go').onclick=function(){ prime(); replace(function(){
        return startSpeakSelf(pool,color,ctx); },'口說練習（自評）',color); };
      return d;
    }, '口說練習', color);
    return;
  }
  go(render, '口說練習', color);
}
function startSpeakSelf(pool,color,ctx){
  ctx = ctx || {};
  var ix=0, ok=0, results=[], gained=0;
  function render(){
    var item=pool[ix];
    var h='<div class="prog"><span>'+(ix+1)+' / '+pool.length+'</span>'+
      '<span class="track"><i class="fill" style="width:'+(ix/pool.length*100)+'%"></i></span><span></span></div>'+
      '<div class="stage"><div class="ask">用日文念出來，再對答案</div>'+
      '<div class="big-zh zh">'+esc(item.z)+'</div>'+
      '<button class="speaker" id="spk">'+SVG.speaker+'</button>'+
      '<div id="rv" hidden></div></div><div id="after"></div><div class="spacer"></div>'+
      '<button class="btn primary" id="show">對答案</button>';
    var d=screen(h);
    d.querySelector('#spk').onclick=function(){ speak(toKanji(item.j)); };
    d.querySelector('#show').onclick=function(){
      var rv=d.querySelector('#rv'); rv.hidden=false;
      rv.innerHTML='<div class="big-jp jp">'+jpHTML(item.j)+'</div>';
      speak(toKanji(item.j));
      var ah = (item.n?'<div class="note zh"><b>用法：</b>'+esc(item.n)+'</div>':'')+
        '<div class="row" style="margin-top:12px">'+
        '<button class="btn ghost" id="no">再練一次</button>'+
        '<button class="btn primary" id="yes">我念對了</button></div>';
      d.querySelector('#after').innerHTML=ah;
      d.querySelector('#show').hidden=true;
      d.querySelector('#no').onclick=function(){ mark(item.i,false); results.push({item:item,score:0}); step(); };
      d.querySelector('#yes').onclick=function(){ if(mark(item.i,true).levelUp) gained++;
        ok++; results.push({item:item,score:1}); step(); };
    };
    function step(){ ix++; if(ix>=pool.length) showSpeakResult(ok,pool.length,results,color,gained,ctx);
      else replace(render,'口說練習（自評）',color); }
    return d;
  }
  return render();
}

/* ══════════ 聽讀跟讀（免持） ══════════ */
function startShadow(pool, color, ctx){
  ctx = ctx || {};
  var ix=0, playing=true, stopped=false, gained=0;
  function render(){
    stopped = false;                 /* 每句重置 */
    var item=pool[ix];
    var h='<div class="prog"><span>'+(ix+1)+' / '+pool.length+'</span>'+
      '<span class="track"><i class="fill" style="width:'+(ix/pool.length*100)+'%"></i></span>'+
      '<span id="st">播放中</span></div>'+
      '<div class="stage"><div class="ask">'+esc(SC[item.s]?SC[item.s].label:'')+'</div>'+
      '<div class="big-jp jp">'+jpHTML(item.j)+'</div>'+
      '<div class="sub-zh zh">'+esc(item.z)+'</div>'+
      (item.n?'<div class="note zh" style="text-align:left;align-self:stretch">'+esc(item.n)+'</div>':'')+
      '</div><div class="spacer"></div>'+
      '<div class="row"><button class="btn ghost" id="prev">上一句</button>'+
      '<button class="btn ghost" id="nx">下一句</button></div>'+
      '<button class="btn primary" id="pp">暫停</button>';
    var d=screen(h);
    var st=d.querySelector('#st'), pp=d.querySelector('#pp');
    function sync(){ st.textContent = playing?'播放中':'已暫停'; pp.textContent = playing?'暫停':'繼續'; }
    pp.onclick=function(){ playing=!playing; sync();
      if(playing){ prime(); loop(); } else { stopSpeak(); } };
    d.querySelector('#prev').onclick=function(){ stopSpeak(); ix=(ix-1+pool.length)%pool.length;
      replace(render,'聽讀跟讀',color); };
    d.querySelector('#nx').onclick=function(){ stopSpeak(); ix=(ix+1)%pool.length;
      replace(render,'聽讀跟讀',color); };
    async function loop(){
      if(stopped||!playing) return;
      await speak(toKanji(item.j));
      if(stopped||!playing) return;
      await sleep(S.pace*1000);              /* 留白給你跟著念 */
      if(stopped||!playing) return;
      await speak(toKanji(item.j), Math.max(0.6,S.rate-0.1));
      if(stopped||!playing) return;
      await sleep(900);
      if(stopped||!playing) return;
      if(mark(item.i,true).levelUp) gained++;
      ix++;
      if(ix>=pool.length){ wake(false); showResult(pool.length,pool.length,[],'聽讀跟讀',color,gained,ctx); }
      else replace(render,'聽讀跟讀',color);
    }
    autoStop=function(){ stopped=true; };
    wake(true); sync();
    setTimeout(function(){ prime(); loop(); }, 400);
    return d;
  }
  go(render,'聽讀跟讀',color);
}

/* ══════════ 情境模擬 ══════════ */
function dialogPickScreen(){
  var h='<div class="eyebrow">選一個場景走一遍</div><div class="scenes">';
  D.dialogs.forEach(function(dg){
    var s=SC[dg.scene]||{color:'var(--accent)'};
    h+='<button class="scene" data-d="'+dg.id+'" style="--sc:'+s.color+'"><span class="bar2"></span>'+
      '<span class="b"><strong>'+esc(dg.title)+'</strong><em class="zh" style="font-family:var(--zh)">'+esc(dg.sub)+'</em></span>'+
      '<span class="chev">'+SVG.chev+'</span></button>';
  });
  h+='</div>';
  var d=screen(h);
  d.querySelectorAll('.scene').forEach(function(b){
    b.onclick=function(){ prime();
      var dg = D.dialogs.filter(function(x){return x.id===b.dataset.d;})[0];
      startDialog(dg); };
  });

}
/* 店員一個聲音、你一個聲音。有兩個日文語音就各用一個，只有一個就用音調區分。 */
function roleOpt(who){
  if(!S.roles) return {};
  if(who==='me') return { voice: altVoice||theVoice, pitch: (S.pitch||1) + (altVoice?0:0.16) };
  return { voice: theVoice, pitch: S.pitch||1 };
}
function startDialog(dg){
  var col = (SC[dg.scene]||{}).color || '';
  var ti=0, right=0, asked=0, log=[];
  function render(){
    var h='<div class="scenesetup zh">'+esc(dg.sub)+'</div><div class="chat" id="chat"></div>'+
      '<div id="area"></div><div class="spacer"></div>';
    var d=screen(h);
    var chat=d.querySelector('#chat'), area=d.querySelector('#area');
    /* 中文預設蓋住，不然眼睛會直接跳過日文去讀中文，等於沒在練聽 */
    function bubble(side, j, z, wrong, open){
      var b=document.createElement('div');
      b.className='bub '+(side==='them'?'them':'me')+(wrong?' wrong':'');
      var shown = S.dlgZh || !!open;
      b.innerHTML='<div class="j">'+jpHTML(j)+'</div>'+
        '<div class="z zh"'+(shown?'':' hidden')+'>'+esc(z)+'</div>'+
        '<div class="bact">'+
          (side==='them'?'<button class="spk" data-a="say">'+SVG.small+' 再聽</button>':'')+
          (shown?'':'<button class="spk" data-a="zh">看中文</button>')+
        '</div>';
      b.querySelectorAll('.spk').forEach(function(btn){
        btn.onclick=function(){
          if(btn.dataset.a==='say'){ speak(toKanji(j), null, roleOpt(side)); }
          else { b.querySelector('.z').hidden=false; btn.remove(); }
        };
      });
      chat.appendChild(b);
      b.scrollIntoView({block:'nearest',behavior:'smooth'});
      return b;
    }
    function revealAll(){
      chat.querySelectorAll('.bub').forEach(function(b){
        var z=b.querySelector('.z'); if(z) z.hidden=false;
        var h=b.querySelector('[data-a="zh"]'); if(h) h.remove();
      });
    }
    log.forEach(function(L){ bubble(L.side,L.j,L.z,L.wrong,L.open); });
    function step(){
      if(ti>=dg.turns.length){
        area.innerHTML='<div class="verdict '+(right===asked?'ok':'mid')+'" style="margin:14px 0">'+
          '<span class="mk">'+(right===asked?'✓':'～')+'</span>這個場景走完了：'+right+' / '+asked+' 題答對</div>'+
          '<div class="row"><button class="btn ghost" id="ag">再走一次</button>'+
          '<button class="btn primary" id="hm">換一個場景</button></div>';
        area.querySelector('#ag').onclick=function(){ ti=0;right=0;asked=0;log=[]; replace(render,dg.title,col); };
        area.querySelector('#hm').onclick=function(){ back(); };
        return;
      }
      var t=dg.turns[ti];
      if(t.who==='clerk'){
        log.push({side:'them',j:t.j,z:t.z});
        bubble('them',t.j,t.z);
        speak(toKanji(t.j), null, roleOpt('them'));
        ti++;
        setTimeout(step, 1100);
        return;
      }
      asked++;
      var opts=shuffle(t.opts);
      var h2='<div class="qrow"><div class="eyebrow">'+esc(t.q)+'</div>'+
        (S.dlgZh?'':'<button class="hintbtn" id="hint">提示・看中文</button>')+'</div><div class="opts">';
      opts.forEach(function(o,n){
        h2+='<button class="opt" data-n="'+t.opts.indexOf(o)+'"><span class="k">'+(n+1)+'</span>'+
          '<span class="txt"><span class="jp">'+jpHTML(o.j)+'</span>'+
          '<span class="ozh zh"'+(S.dlgZh?'':' hidden')+'>'+esc(o.z)+'</span></span></button>';
      });
      h2+='</div><div id="fb"></div>';
      area.innerHTML=h2;
      var hintBtn = area.querySelector('#hint');
      if(hintBtn) hintBtn.onclick=function(){
        area.querySelectorAll('.ozh').forEach(function(z){ z.hidden=false; });
        revealAll(); hintBtn.remove();
      };
      area.querySelectorAll('.opt').forEach(function(b){
        b.onclick=function(){
          var o=t.opts[+b.dataset.n], good=!!o.ok;
          if(good) right++;
          countDay();
          area.querySelectorAll('.opt').forEach(function(x){
            var ox=t.opts[+x.dataset.n];
            if(ox.ok) x.classList.add('good'); else if(x===b) x.classList.add('bad'); else x.classList.add('dim');
          });
          /* 答完才把所有中文攤開 */
          area.querySelectorAll('.ozh').forEach(function(z){ z.hidden=false; });
          if(hintBtn) hintBtn.remove();
          revealAll();
          log.forEach(function(L){ L.open=true; });
          log.push({side:'me',j:o.j,z:o.z,wrong:!good,open:true});
          bubble('me',o.j,o.z,!good,true);
          speak(toKanji(o.j), null, roleOpt('me'));
          var corr = t.opts.filter(function(x){return x.ok;})[0];
          var fh='<div class="verdict '+(good?'ok':'no')+'" style="margin-top:12px">'+
            '<span class="mk">'+(good?'✓':'✕')+'</span>'+(good?'這樣回就對了':'這句不太對')+'</div>';
          if(!good && o.why) fh+='<div class="note zh"><b>為什麼不行：</b>'+esc(o.why)+'</div>';
          if(!good) fh+='<div class="note zh" style="margin-top:8px"><b>應該說：</b><span class="jp">'+
            jpHTML(corr.j)+'</span>（'+esc(corr.z)+'）</div>';
          if(corr.note) fh+='<div class="note zh" style="margin-top:8px">'+esc(corr.note)+'</div>';
          fh+='<button class="btn primary" id="go" style="margin-top:12px">繼續</button>';
          area.querySelector('#fb').innerHTML=fh;
          area.querySelector('#go').onclick=function(){ ti++; step(); };
          setTimeout(function(){ area.querySelector('#fb').scrollIntoView({block:'nearest',behavior:'smooth'}); },60);
        };
      });
    }
    setTimeout(step,300);
    return d;
  }
  go(render,dg.title,col);
}

function startPair(p, col){
  var items = p.ids.map(function(id){ return BY_ID[id]; }).filter(Boolean);
  function learnScreen(){
    var h='<div class="pairtip zh">'+esc(p.tip)+'</div><div class="opts">';
    items.forEach(function(it){
      h+='<div class="opt" style="cursor:default"><span class="txt">'+
        '<span class="jp" style="font-size:18px;line-height:2">'+jpHTML(it.j)+'</span>'+
        '<span class="zh" style="display:block;font-size:13px;color:var(--muted);margin-top:3px">'+esc(it.z)+'</span>'+

    });
    h+='</div><div class="spacer"></div><button class="btn primary" id="go">開始測驗</button>';
    var d=screen(h);
    d.querySelectorAll('button[data-i]').forEach(function(b){
      b.onclick=function(){ speak(toKanji(BY_ID[b.dataset.i].j)); }; });
    d.querySelector('#go').onclick=function(){ prime(); quiz(); };
    return d;
  }
  function quiz(){
    var seq = shuffle(items.concat(items)), ix=0, right=0;
    function render(){
      var item=seq[ix];
      var h='<div class="prog"><span>'+(ix+1)+' / '+seq.length+'</span>'+
        '<span class="track"><i class="fill" style="width:'+(ix/seq.length*100)+'%"></i></span>'+
        '<span>'+right+' 對</span></div>'+
        '<div class="stage"><div class="ask">這個意思要用哪一句？</div>'+
        '<div class="big-zh zh">'+esc(item.z)+'</div></div><div class="opts">';
      shuffle(items).forEach(function(o,n){
        h+='<button class="opt" data-i="'+o.i+'"><span class="k">'+(n+1)+'</span>'+
          '<span class="txt jp" style="font-size:17.5px;line-height:1.95">'+jpHTML(o.j)+'</span></button>';
      });
      h+='</div><div id="after"></div><div class="spacer"></div>';
      var d=screen(h), done=false;
      d.querySelectorAll('.opt').forEach(function(b){
        b.onclick=function(){
          if(done) return; done=true;
          var good=b.dataset.i===item.i; mark(item.i,good); if(good) right++;
          d.querySelectorAll('.opt').forEach(function(x){
            if(x.dataset.i===item.i) x.classList.add('good');
            else if(x===b) x.classList.add('bad'); else x.classList.add('dim'); });
          speak(toKanji(item.j));
          var ah='<div class="verdict '+(good?'ok':'no')+'"><span class="mk">'+(good?'✓':'✕')+'</span>'+
            (good?'對了':'注意看差在哪裡')+'</div><div class="pairtip zh">'+esc(p.tip)+'</div>'+
            '<button class="btn primary" id="n" style="margin-top:12px">'+
            (ix+1>=seq.length?'看結果':'下一題')+'</button>';
          d.querySelector('#after').innerHTML=ah;
          d.querySelector('#n').onclick=function(){ ix++;
            if(ix>=seq.length) showResult(right,seq.length,[],p.title,col);
            else replace(render,p.title,col); };
        };
      });
      return d;
    }
    replace(render,p.title,col);
  }
  go(learnScreen,p.title,col);

/* ══════════ 結果 ══════════ */
function showResult(right,total,wrong,title,color,gained,ctx){
  ctx = ctx || {}; gained = gained || 0;
  replace(function(){
    var pct = total? Math.round(right/total*100):0;
    var t = tally();
    var h='<div class="card score"><div class="pct">'+pct+'%</div>'+
      '<div class="lbl">'+total+' 題中答對 '+right+' 題</div></div>';

    /* 這一輪到底換到了什麼 —— 不是只給一個分數就結束 */
    if(ctx.kind==='check'){
      h += '<div class="banner good"><span class="ic">✓</span><div>'+
        (pct>=80
          ? '驗收通過。答對的那些句子已經升到<b>已精通</b>，表示你是真的記住了，不是剛好猜對。'
          : '有幾句還不太穩，已經退回「學習中」排進複習。這很正常，再練一輪就回來了。')+
        '</div></div>';
    } else if(gained){
      h += '<div class="banner good"><span class="ic">✓</span><div>這一輪你<b>新學會 '+gained+' 句</b>。</div></div>';
    }

    h += '<div class="card progwrap">'+
      '<div class="prow"><span class="plabel">累計進度</span>'+
        '<span class="pnum">'+t.known+' <span class="muted">/ '+t.total+' 句已學會</span></span></div>'+
      '<div class="pbar"><i class="seg known" style="width:'+(t.known/t.total*100)+'%"></i>'+
        '<i class="seg doing" style="width:'+((t.started-t.known)/t.total*100)+'%"></i></div>'+
      '<div class="plegend"><span><i class="dot known"></i>已學會 '+t.known+'</span>'+
        '<span><i class="dot doing"></i>學習中 '+(t.started-t.known)+'</span>'+
        '<span><i class="dot master"></i>已精通 '+t.master+'</span></div></div>';

    if(wrong && wrong.length){
      h+='<div class="eyebrow">這幾句再看一次</div><div class="wronglist">';
      wrong.slice(0,6).forEach(function(w){
        h+='<div class="wrongrow"><div class="b"><div class="j jp">'+jpHTML(w.j)+'</div>'+
          '<div class="z zh">'+esc(w.z)+'</div></div>'+
          '<button data-i="'+w.i+'">'+SVG.small+'</button></div>';
      });
      h+='</div><div class="note zh">'+
        (wrong.length>6 ? '另外還有 '+(wrong.length-6)+' 句，' : '')+
        '這些已經收進「錯題複習」，之後會自動排回來給你練，不用自己記。</div>';
    }

    var left = ctx.sel ? freshLeft(ctx.sel, ctx.mode) : 0;
    h+='<div class="spacer"></div>';
    if(ctx.kind==='round'){
      h += '<div class="note zh" style="margin-bottom:10px">'+
        (left ? '這些情境還有 <b>'+left+' 句</b>沒練過。' : '這些情境的句子都練過一輪了，接下來會以複習為主。')+
        '</div><button class="btn primary" id="next">繼續下一輪（第 '+((ctx.round||1)+1)+' 輪）</button>'+
        '<div class="row" style="margin-top:9px">'+
        (wrong && wrong.length ? '<button class="btn ghost" id="again">只練錯的</button>' : '')+
        '<button class="btn ghost" id="home">回首頁</button></div>';
    } else {
      h += '<div class="row">'+
        (wrong && wrong.length ? '<button class="btn ghost" id="again">只練錯的</button>' : '')+
        '<button class="btn primary" id="home">回首頁</button></div>';
    }
    var d=screen(h);
    d.querySelectorAll('.wrongrow button').forEach(function(b){
      b.onclick=function(){ speak(toKanji(BY_ID[b.dataset.i].j)); }; });
    var nx = d.querySelector('#next');
    if(nx) nx.onclick=function(){ prime(); startRound(ctx.sel, ctx.mode, (ctx.round||1)+1); };
    var ag = d.querySelector('#again');
    if(ag) ag.onclick=function(){ prime(); startQuiz(shuffle(wrong),'mix',title+'・錯題',color,{kind:'retry'}); };
    d.querySelector('#home').onclick=function(){ nav=[{r:homeScreen,t:'日本旅行會話',c:''}]; draw(); };
    return d;
  }, '練習結果', color);
}
function showSpeakResult(great,total,results,color,gained,ctx){
  ctx = ctx || {}; gained = gained || 0;
  replace(function(){
    var pct= total?Math.round(great/total*100):0;
    var h='<div class="card score"><div class="pct">'+pct+'%</div>'+
      '<div class="lbl">'+total+' 句中念對 '+great+' 句</div></div>';
    var low = results.filter(function(r){ return r.score<0.86; });
    if(low.length){
      h+='<div class="eyebrow">這幾句再練</div><div class="wronglist">';
      low.forEach(function(r){
        h+='<div class="wrongrow"><div class="b"><div class="j jp">'+jpHTML(r.item.j)+'</div>'+
          '<div class="z zh">'+esc(r.item.z)+(r.heard?' ・辨識到「'+esc(r.heard)+'」':'')+'</div></div>'+
          '<button data-i="'+r.item.i+'">'+SVG.small+'</button></div>';
      });
      h+='</div>';
    } else h+='<div class="banner good"><span class="ic">✓</span><div>這一輪都念對了。</div></div>';
    if(gained) h+='<div class="banner good"><span class="ic">✓</span><div>這一輪你<b>新學會 '+gained+' 句</b>。</div></div>';
    var t = tally();
    h += '<div class="card progwrap">'+
      '<div class="prow"><span class="plabel">累計進度</span>'+
        '<span class="pnum">'+t.known+' <span class="muted">/ '+t.total+' 句已學會</span></span></div>'+
      '<div class="pbar"><i class="seg known" style="width:'+(t.known/t.total*100)+'%"></i>'+
        '<i class="seg doing" style="width:'+((t.started-t.known)/t.total*100)+'%"></i></div></div>';
    h+='<div class="spacer"></div>';
    if(ctx.kind==='round'){
      var left = freshLeft(ctx.sel, ctx.mode);
      h += '<div class="note zh" style="margin-bottom:10px">'+
        (left ? '這些情境還有 <b>'+left+' 句</b>沒練過。' : '這些情境都練過一輪了。')+'</div>'+
        '<button class="btn primary" id="next">繼續下一輪（第 '+((ctx.round||1)+1)+' 輪）</button>'+
        '<div class="row" style="margin-top:9px"><button class="btn ghost" id="home">回首頁</button></div>';
    } else {
      h += '<button class="btn primary" id="home">回首頁</button>';
    }
    var d=screen(h);
    d.querySelectorAll('.wrongrow button').forEach(function(b){
      b.onclick=function(){ speak(toKanji(BY_ID[b.dataset.i].j)); }; });
    var nx=d.querySelector('#next');
    if(nx) nx.onclick=function(){ prime(); startRound(ctx.sel, ctx.mode, (ctx.round||1)+1); };
    d.querySelector('#home').onclick=function(){ nav=[{r:homeScreen,t:'日本旅行會話',c:''}]; draw(); };
    return d;
  },'口說結果',color);
}

/* ══════════ 設定 ══════════ */
var SHEET=el('sheet'), PANEL=el('sheetPanel');
el('btnSet').onclick=function(){ prime(); openSheet(); };
SHEET.onclick=function(e){ if(e.target===SHEET) closeSheet(); };
function closeSheet(){ SHEET.hidden=true; stopSpeak(); }
function openSheet(focus){
  loadVoices();
  var env = location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1';
  var net = voicesJa.filter(isNetVoice).length;
  var h='<div class="grab"></div><h2>設定</h2>';

  /* 「聽起來像機器人」幾乎都是因為手機用的是本機壓縮語音，而不是網路神經語音 */
  h+='<div class="set" id="sVoice"><label>日文語音</label>';
  if(!voicesJa.length){
    h+='<div class="hint">還沒偵測到日文語音。<br>'+
       '<b>Android</b>：設定 → 系統 → 語言與輸入 → 文字轉語音輸出 → Google 文字轉語音 → 安裝語音資料 → 日本語。<br>'+
       '<b>iPhone</b>：設定 → 輔助使用 → 朗讀內容 → 語音 → 日文。<br>'+
       '<b>Windows</b>：設定 → 時間與語言 → 語音 → 新增日文。<br>裝好後重新整理這個頁面。</div>';
  } else {
    h+='<button class="btn primary" id="vwiz" style="margin-bottom:4px">聽一句，幫我挑最好的語音</button>';
    h+='<div class="voicelist">';
    voicesJa.forEach(function(v,n){
      var sel = theVoice && v.voiceURI===theVoice.voiceURI, nv = isNetVoice(v);
      h+='<div class="vrow'+(sel?' sel':'')+'" data-u="'+esc(v.voiceURI)+'">'+
        '<span class="vn">'+esc(v.name||v.lang)+
          '<span class="vq'+(nv?' net':'')+'">'+voiceTag(v)+'</span></span>'+
        (n===0?'<span class="tag">建議</span>':'')+
        '<button data-act="try">試聽</button>'+
        '<button data-act="use">'+(sel?'使用中':'選用')+'</button></div>';
    });
    h+='</div>';
    if(!net) h+='<div class="banner" style="margin-top:8px"><span class="ic">！</span><div>'+
      '這台手機目前只有<b>本機語音</b>，那是壓縮過的小模型，聽起來就是機器人。<br><br>'+
      '要換成接近真人的網路語音：<b>設定 → 系統 → 語言與輸入 → 文字轉語音輸出</b>，'+
      '引擎選「Google 文字轉語音」，點旁邊的齒輪 → <b>安裝語音資料 → 日本語</b>，'+
      '把清單裡標示較大檔案的那幾個（通常寫著「高品質」或下載圖示）裝起來，'+
      '並把「<b>使用網路語音</b>」打開。回來重新整理這個頁面就會多出選項。</div></div>';
    else h+='<div class="hint">標「網路・自然」的是神經語音，接近真人；標「本機」的是壓縮模型，'+
      '沒網路時才建議用。聽不習慣就換一個試試，設定會記住。</div>';
  }
  h+='</div>';

  h+='<div class="set"><label>日文顯示方式</label><div class="seg" id="segD">'+
     '<button data-v="kanji" aria-pressed="'+(S.display==='kanji')+'">漢字＋假名</button>'+
     '<button data-v="kana" aria-pressed="'+(S.display==='kana')+'">純假名</button></div></div>';

  h+='<div class="set"><label>朗讀語速</label><div class="seg" id="segR">'+
     [['0.65','很慢'],['0.8','慢'],['0.95','正常'],['1.1','快']].map(function(r){
       return '<button data-v="'+r[0]+'" aria-pressed="'+(String(S.rate)===r[0])+'">'+r[1]+'</button>';
     }).join('')+'</div></div>';

  h+='<div class="set"><label>聲音高低</label><div class="seg" id="segT">'+
     [['0.85','低沉'],['1','標準'],['1.2','輕快'],['1.35','更高']].map(function(r){
       return '<button data-v="'+r[0]+'" aria-pressed="'+(String(S.pitch)===r[0])+'">'+r[1]+'</button>';
     }).join('')+'</div><div class="hint">調高會比較像卡通角色的語氣。超過這個範圍就會開始像變聲器，所以我沒有開放更高。</div></div>';

  h+='<div class="set"><label>每輪題數</label><div class="seg" id="segC">'+
     [['10','10'],['15','15'],['25','25'],['0','全部']].map(function(r){
       return '<button data-v="'+r[0]+'" aria-pressed="'+(String(S.count)===r[0])+'">'+r[1]+'</button>';
     }).join('')+'</div></div>';

  h+='<div class="set"><label>跟讀留白</label><div class="seg" id="segP">'+
     [['2.2','短'],['3.2','中'],['4.5','長']].map(function(r){
       return '<button data-v="'+r[0]+'" aria-pressed="'+(String(S.pace)===r[0])+'">'+r[1]+'</button>';
     }).join('')+'</div><div class="hint">跟讀模式播完一句後，留給你跟著念的時間。</div></div>';

  h+='<div class="set"><label>練習行為</label>'+
     '<div class="sw"><div class="l"><strong>口說免持模式</strong>'+
     '<em>播範讀 → 嗶聲 → 自動開麥 → 判定 → 自動下一句，整輪手不用碰螢幕。</em></div>'+
     '<button class="toggle" id="tgH" aria-pressed="'+(S.hands?'true':'false')+'" aria-label="免持模式"></button></div>'+
     '<div class="sw"><div class="l"><strong>口說前先播範讀</strong>'+
     '<em>關掉就變成真正的測驗：只看中文，自己想怎麼講。</em></div>'+
     '<button class="toggle" id="tgM" aria-pressed="'+(S.model?'true':'false')+'" aria-label="範讀"></button></div>'+
     '<div class="sw"><div class="l"><strong>對話用兩個角色的聲音</strong>'+
     '<em>情境模擬裡店員和你用不同的聲音。這台裝置有兩個以上日文語音就各用一個，只有一個就用音調區分。</em></div>'+
     '<button class="toggle" id="tgR" aria-pressed="'+(S.roles?'true':'false')+'" aria-label="角色聲音"></button></div>'+
     '<div class="sw"><div class="l"><strong>情境模擬直接顯示中文</strong>'+
     '<em>預設關閉：先只看日文，看不懂再按「提示」，答完會自動攤開全部中文。打開就一律顯示。</em></div>'+
     '<button class="toggle" id="tgZ" aria-pressed="'+(S.dlgZh?'true':'false')+'" aria-label="對話顯示中文"></button></div>'+
     '<div class="sw"><div class="l"><strong>嚴格判定</strong>'+
     '<em>開啟後助詞念錯就算沒過，適合已經練熟想抓細節的時候。</em></div>'+
     '<button class="toggle" id="tgS" aria-pressed="'+(S.strict?'true':'false')+'" aria-label="嚴格判定"></button></div></div>';

  h+='<div class="set"><label>這台裝置的支援狀況</label>'+
     '<div class="hint">'+
     '朗讀：'+(TTS_OK?(voicesJa.length?('可用 ・ 偵測到 '+voicesJa.length+' 個日文語音'):'可用，但尚未偵測到日文語音'):'不支援')+'<br>'+
     '語音辨識：'+(!ASR_PRESENT?'這個瀏覽器不支援':(asrBlocked?'被環境擋住（會自動切成自評）':(env?'可用':'目前網址不是 https 或 localhost，麥克風會被擋')))+'<br>'+
     '螢幕恆亮：'+(('wakeLock' in navigator)?'可用':'不支援（請自己把螢幕休眠時間調長）')+
     '</div></div>';

  h+='<div class="set"><button class="btn ghost" id="reset">清除練習紀錄</button></div>'+
     '<button class="btn primary" id="close">完成</button>';

  PANEL.innerHTML=h; SHEET.hidden=false;
  function seg(id,key,cast){
    var w=PANEL.querySelector(id); if(!w) return;
    w.querySelectorAll('button').forEach(function(b){
      b.onclick=function(){
        S[key]=cast(b.dataset.v); saveSet();
        w.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed', x===b?'true':'false'); });
      };
    });
  }
  seg('#segD','display',String); seg('#segR','rate',Number);
  seg('#segC','count',Number);   seg('#segP','pace',Number);
  seg('#segT','pitch',Number);
  var segT = PANEL.querySelector('#segT');
  if(segT) segT.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click', function(){ speak('すみません、ちょっといいですか。'); });
  });
  function tog(id,key){ var b=PANEL.querySelector(id); if(!b) return;
    b.onclick=function(){ S[key]=!S[key]; saveSet(); b.setAttribute('aria-pressed',S[key]?'true':'false'); }; }
  tog('#tgH','hands'); tog('#tgM','model'); tog('#tgS','strict'); tog('#tgZ','dlgZh'); tog('#tgR','roles');
  PANEL.querySelectorAll('.vrow button').forEach(function(b){
    b.onclick=function(){
      var row=b.parentNode, uri=row.dataset.u, v=null;
      voicesJa.forEach(function(x){ if(x.voiceURI===uri) v=x; });
      if(!v) return;
      if(b.dataset.act==='try'){
        var prev=theVoice; theVoice=v;
        speak('すみません、駅はどこですか。').then(function(){ theVoice = prev || v; });
      } else {
        S.voice=uri; S.voiceOK=1; saveSet(); theVoice=v;
        PANEL.querySelectorAll('.vrow').forEach(function(r){
          var on = r.dataset.u===uri;
          r.classList.toggle('sel',on);
          var ub=r.querySelector('[data-act="use"]'); if(ub) ub.textContent = on?'使用中':'選用';
        });
        speak('ありがとうございます。');
      }
    };
  });

  /* 語音精靈：放一句真的會用到的話，聽不清楚就換下一個，不用自己讀名字猜 */
  var wiz = PANEL.querySelector('#vwiz');
  if(wiz) wiz.onclick=function(){
    var idx = 0, SAMPLE = 'すみません、駅はどこですか。';
    voicesJa.forEach(function(v,n){ if(theVoice && v.voiceURI===theVoice.voiceURI) idx=n; });
    var box = document.createElement('div');
    box.className = 'wiz';
    wiz.replaceWith(box);
    function show(){
      var v = voicesJa[idx];
      theVoice = v;
      box.innerHTML = '<div class="wtop"><b>'+esc(v.name||v.lang)+'</b>'+
        '<span class="vq'+(isNetVoice(v)?' net':'')+'">'+voiceTag(v)+'</span></div>'+
        '<div class="wsample jp">すみません、{駅|えき}はどこですか。</div>'.replace(RUBY,
          S.display==='kana' ? '$2' : '<ruby>$1<rt>$2</rt></ruby>')+
        '<div class="wask zh">這句聽得清楚嗎？</div>'+
        '<div class="row"><button class="btn ghost" id="wno">聽不清楚，換下一個</button>'+
        '<button class="btn primary" id="wyes">就用這個</button></div>'+
        '<div class="hint">'+(idx+1)+' / '+voicesJa.length+' 個日文語音</div>';
      speak(SAMPLE);
      box.querySelector('#wyes').onclick=function(){
        S.voice=v.voiceURI; S.voiceOK=1; saveSet();
        box.innerHTML='<div class="banner good"><span class="ic">✓</span><div>好，之後都用 <b>'+
          esc(v.name||v.lang)+'</b>。隨時可以回到這裡換。</div></div>';
      };
      box.querySelector('#wno').onclick=function(){
        if(idx+1 < voicesJa.length){ idx++; show(); }
        else {
          box.innerHTML='<div class="banner"><span class="ic">！</span><div>'+
            '這台手機上的日文語音都試過了。如果每個都覺得機械，表示系統只裝了本機語音——'+
            '到「<b>設定 → 系統 → 語言與輸入 → 文字轉語音輸出</b>」，引擎選 Google 文字轉語音，'+
            '點齒輪 → <b>安裝語音資料 → 日本語</b>，把高品質的那幾個下載下來，'+
            '並開啟「<b>使用網路語音</b>」，再回來重新整理這頁。</div></div>';
          S.voiceOK=1; saveSet();
        }
      };
    }
    show();
  };

  PANEL.querySelector('#reset').onclick=function(){
    P={}; ST={days:{},streak:0,last:''}; saveProg(); saveStats();
    PANEL.querySelector('#reset').textContent='已清除';
    if(nav.length===1) draw();
  };
  PANEL.querySelector('#close').onclick=closeSheet;
  if(focus==='voice'){
    var sv = PANEL.querySelector('#sVoice');
    if(sv) setTimeout(function(){ sv.scrollIntoView({block:'start',behavior:'smooth'}); }, 80);
  }
}

/* ══════════ 啟動 ══════════ */
var autoStop = function(){};
document.addEventListener('keydown',function(e){
  if(SHEET.hidden===false) return;
  var n = parseInt(e.key,10);
  if(n>=1&&n<=4){ var b=MAIN.querySelectorAll('.opt')[n-1]; if(b&&b.tagName==='BUTTON') b.click(); }
  if(e.key==='Escape'&&nav.length>1) back();
});
nav=[{r:homeScreen,t:'日本旅行會話',c:''}];
draw();
})();
